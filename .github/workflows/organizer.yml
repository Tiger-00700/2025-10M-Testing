name: Newbook-only Pipeline

on:
  push:
    branches:
      - '**'
  workflow_dispatch: {}

jobs:
  newbook:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build (newbook-only)
        shell: pwsh
        env:
          CHECK_INCLUDE_ORGANIZED: "0"
        run: |
          pwsh -NoLogo -NoProfile -File "tools/pipeline/build_all.ps1" -SkipOrganize

      - name: Upload reports artifact
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            tools/reports/**
            book/附录-图表目录.md
            book/附录-代码清单.md
            book/附录-脚本索引.md
            book/1022.2025.newbook.augmented.md
