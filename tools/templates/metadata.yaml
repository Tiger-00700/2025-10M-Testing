# Pandoc metadata / variables for consistent typesetting
# Drop your publisher settings here and they will be picked up automatically
# by tools/pipeline/make_typeset_bundle.ps1 when present.

# Core
title: "大数据测试：方法、工具与实战"
subtitle: "2025 版"
author:
  - name: "Tiger-00700"
    affiliation: ""
lang: zh-CN
# Add a date or let Pandoc generate today
# date: 2025-11-05

# Table of contents and numbering
toc: true
number-sections: true
toc-depth: 3

# PDF engine and page setup (when using xelatex)
# Note: requires the fonts to be installed; otherwise Pandoc will fall back.
geometry:
  - a4paper
  - margin=2.2cm
linkcolor: blue
urlcolor: blue
colorlinks: true

# Fonts (XeLaTeX)
# Prefer robust CJK setup with fallbacks on Windows; handled via header-includes below.
fontsize: 11pt

# XeLaTeX robust font chain (handles missing fonts gracefully)
header-includes:
  - |
    % --- Robust CJK font configuration for XeLaTeX ---
    \usepackage{iftex}
    \ifXeTeX
      \usepackage{fontspec}
      \usepackage{xeCJK}
      \defaultfontfeatures{Ligatures=TeX,Scale=MatchLowercase}
      % Latin fonts with fallbacks
      \IfFontExistsTF{Times New Roman}{\setmainfont{Times New Roman}}{\setmainfont{TeX Gyre Termes}}
      \IfFontExistsTF{Arial}{\setsansfont{Arial}}{\setsansfont{TeX Gyre Heros}}
      \IfFontExistsTF{Consolas}{\setmonofont{Consolas}}{\setmonofont{Latin Modern Mono}}
      % CJK serif chain: Source Han Serif SC -> Noto Serif CJK SC -> SimSun -> Songti SC
      \IfFontExistsTF{Source Han Serif SC}{\setCJKmainfont{Source Han Serif SC}}{%
        \IfFontExistsTF{Noto Serif CJK SC}{\setCJKmainfont{Noto Serif CJK SC}}{%
          \IfFontExistsTF{SimSun}{\setCJKmainfont{SimSun}}{\setCJKmainfont{Songti SC}}}}
      % Optional CJK sans for headings
      \IfFontExistsTF{Source Han Sans SC}{\setCJKsansfont{Source Han Sans SC}}{%
        \IfFontExistsTF{Noto Sans CJK SC}{\setCJKsansfont{Noto Sans CJK SC}}{%
          \IfFontExistsTF{Microsoft YaHei}{\setCJKsansfont{Microsoft YaHei}}{\setCJKsansfont{SimHei}}}}
    \fi

# DOCX specific (reference doc is preferred; this still helps for built-in styles)
# reference-doc: tools/templates/reference.docx

# HTML specific
# Injected via --css tools/templates/book.css when present

# Misc variables
papersize: a4
keywords:
  - 大数据
  - 测试
  - 自动化
  - 性能
