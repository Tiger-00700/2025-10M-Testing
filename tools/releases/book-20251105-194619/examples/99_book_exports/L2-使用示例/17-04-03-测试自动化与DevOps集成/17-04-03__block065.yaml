## 构建Docker镜像

> 【阅读提示】本篇聚焦：构建Docker镜像。建议先看结构，再带着问题阅读，关注关键术语、流程与案例，结合自身项目做对照。

package:
  stage: package
  image: docker:20.10
  services:

    - docker:dind

  script:

    # 登录到Docker仓库

    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $DOCKER_REGISTRY

    # 构建镜像

    - docker build -t $IMAGE_NAME:$CI_COMMIT_SHA .

    - docker tag $IMAGE_NAME:$CI_COMMIT_SHA $IMAGE_NAME:latest

    # 推送镜像

    - docker push $IMAGE_NAME:$CI_COMMIT_SHA

    - docker push $IMAGE_NAME:latest

  only:

    - main

    - tags

## 部署到测试环境

> 【阅读提示】本篇聚焦：部署到测试环境。建议先看结构，再带着问题阅读，关注关键术语、流程与案例，结合自身项目做对照。

deploy-test:
  stage: deploy-test
  image: bitnami/kubectl:latest
  script:
    # 设置kubectl配置

    - mkdir -p ~/.kube

    - echo "$KUBE_CONFIG" > ~/.kube/config

    # 更新部署

    - kubectl set image deployment/bigdata-app bigdata-app=$IMAGE_NAME:$CI_COMMIT_SHA -n test

    # 等待部署完成

    - kubectl rollout status deployment/bigdata-app -n test

  only:

    - main

  environment:

    name: test

## 验收测试

> 【阅读提示】本篇聚焦：验收测试。建议先看结构，再带着问题阅读，关注关键术语、流程与案例，结合自身项目做对照。

acceptance-test:
