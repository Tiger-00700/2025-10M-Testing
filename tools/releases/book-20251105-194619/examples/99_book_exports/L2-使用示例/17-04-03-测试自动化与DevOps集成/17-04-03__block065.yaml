## 准备集成测试环境

> 【阅读提示】本篇聚焦：准备集成测试环境。建议先看结构，再带着问题阅读，关注关键术语、流程与案例，结合自身项目做对照。

prepare-integration-env:
  stage: prepare-integration-env
  image: docker/compose:1.29.2
  services:

    - docker:dind

  script:

    # 创建网络

    - docker network create test-network

    # 启动基础服务（Hadoop, Spark等）

    - docker-compose -f docker-compose-infra.yml up -d

    # 等待服务就绪

    - ./scripts/wait-for-services.sh

    # 初始化测试数据

    - ./scripts/init-test-data.sh

  artifacts:

    paths:

      - integration-test-config/

## 集成测试

> 【阅读提示】本篇聚焦：集成测试。建议先看结构，再带着问题阅读，关注关键术语、流程与案例，结合自身项目做对照。

integration-test:
  stage: integration-test
  image: maven:3.8-openjdk-11
  services:

    - docker:dind

  script:

    # 使用配置连接到测试环境

    - export SPARK_MASTER=spark://spark-master:7077

    - export HDFS_NAMENODE=hdfs://namenode:9000

    # 运行集成测试

    - mvn verify -DskipUnitTests

  artifacts:

    reports:
      junit: target/failsafe-reports/*.xml
  dependencies:

    - prepare-integration-env

