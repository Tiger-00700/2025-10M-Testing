## 创建安全组

> 【阅读提示】本篇聚焦：创建安全组。建议先看结构，再带着问题阅读，关注关键术语、流程与案例，结合自身项目做对照。

resource "aws_security_group" "test_sg" {
  name        = "bigdata-test-sg"
  description = "Security group for big data test environment"
  vpc_id      = aws_vpc.test_vpc.id

  ingress {
    from_port   = 22
    to_port     = 22
    protocol    = "tcp"
    cidr_blocks = ["0.0.0.0/0"]
  }

  # 允许大数据服务所需的端口
  ingress {
    from_port   = 8080
    to_port     = 8080
    protocol    = "tcp"
    cidr_blocks = ["0.0.0.0/0"]
  }

  ingress {
    from_port   = 9000
    to_port     = 9000
    protocol    = "tcp"
    cidr_blocks = ["0.0.0.0/0"]
  }

  egress {
    from_port   = 0
    to_port     = 0
    protocol    = "-1"
    cidr_blocks = ["0.0.0.0/0"]
  }

  tags = {
    Name = "bigdata-test-sg"
  }
}

## 创建EC2实例用于测试

> 【阅读提示】本篇聚焦：创建EC2实例用于测试。建议先看结构，再带着问题阅读，关注关键术语、流程与案例，结合自身项目做对照。

resource "aws_instance" "test_master" {
  ami                    = var.ec2_ami
  instance_type          = var.master_instance_type
  subnet_id              = aws_subnet.test_subnet.id
  vpc_security_group_ids = [aws_security_group.test_sg.id]
  key_name               = var.key_name

  tags = {
    Name = "bigdata-test-master"
    Role = "Master"
  }

  # 启动脚本，配置大数据环境
  user_data = <<-EOF
              #!/bin/bash
              # 安装必要的软件包
              apt-get update
              apt-get install -y openjdk-8-jdk python3 python3-pip

              # 下载并配置Hadoop
              wget https://downloads.apache.org/hadoop/common/hadoop-3.3.1/hadoop-3.3.1.tar.gz
              tar -xzf hadoop-3.3.1.tar.gz -C /opt/
              ln -s /opt/hadoop-3.3.1 /opt/hadoop

              # 下载并配置Spark
              wget https://downloads.apache.org/spark/spark-3.2.1/spark-3.2.1-bin-hadoop3.2.tgz
              tar -xzf spark-3.2.1-bin-hadoop3.2.tgz -C /opt/
              ln -s /opt/spark-3.2.1-bin-hadoop3.2 /opt/spark

              # 配置环境变量
              echo "export JAVA_HOME=/usr/lib/jvm/java-8-openjdk-amd64" >> /etc/profile
              echo "export HADOOP_HOME=/opt/hadoop" >> /etc/profile
              echo "export SPARK_HOME=/opt/spark" >> /etc/profile
              echo "export PATH=$PATH:$HADOOP_HOME/bin:$HADOOP_HOME/sbin:$SPARK_HOME/bin" >> /etc/profile

              # 启动必要的服务
              /opt/hadoop/sbin/start-dfs.sh
              /opt/hadoop/sbin/start-yarn.sh
              /opt/spark/sbin/start-master.sh
              EOF
}

