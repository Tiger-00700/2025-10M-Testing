## Jenkins CI/CD流水线配置示例（Jenkinsfile）

> 【阅读提示】本篇聚焦：Jenkins CI/CD流水线配置示例（Jenkinsfile）。建议先看结构，再带着问题阅读，关注关键术语、流程与案例，结合自身项目做对照。

pipeline {
    agent any

    environment {
        SPARK_HOME = '/opt/spark'
        HADOOP_HOME = '/opt/hadoop'
        JAVA_HOME = '/usr/lib/jvm/java-8-openjdk-amd64'
        PATH = "${env.PATH}:${env.SPARK_HOME}/bin:${env.HADOOP_HOME}/bin"
        TEST_ENV = "test"
    }

    stages {
        // 检出代码
        stage('Checkout') {
            steps {
                checkout scm
            }
        }

        // 代码质量检查
        stage('Code Quality') {
            steps {
                // 静态代码分析
                sh 'mvn checkstyle:checkstyle'
                sh 'mvn spotbugs:check'

                // 单元测试覆盖率
                sh 'mvn jacoco:prepare-agent test jacoco:report'
            }
            post {
                always {
                    // 发布代码质量报告
                    publishHTML([
                        allowMissing: false,
                        alwaysLinkToLastBuild: true,
                        keepAll: true,
                        reportDir: 'target/site/jacoco',
                        reportFiles: 'index.html',
                        reportName: 'JaCoCo Coverage Report'
                    ])
                }
            }
        }

        // 构建项目
        stage('Build') {
            steps {
                sh 'mvn clean package -DskipTests'
            }
        }

        // 单元测试
        stage('Unit Tests') {
            steps {
                sh 'mvn test'
            }
            post {
                always {
                    // 发布测试报告
                    junit 'target/surefire-reports/*.xml'
                }
            }
        }

        // 集成测试环境准备
        stage('Prepare Integration Test Env') {
            steps {
                // 启动测试容器
                sh 'docker-compose -f docker-compose-test.yml up -d'

                // 等待服务就绪
                sh './scripts/wait-for-services.sh'

                // 准备测试数据
                sh './scripts/prepare-test-data.sh'
            }
        }

        // 集成测试
        stage('Integration Tests') {
            parallel {
                // Spark集成测试
                stage('Spark Integration Tests') {
                    steps {
                        sh 'mvn verify -Dtest=Spark*Test'
                    }
                }

                // Hadoop集成测试
                stage('Hadoop Integration Tests') {
                    steps {
                        sh 'mvn verify -Dtest=Hadoop*Test'
                    }
                }

                // 数据质量测试
                stage('Data Quality Tests') {
                    steps {
                        sh './run-data-quality-tests.sh'
                    }
                }
            }
            post {
                always {
                    junit 'target/failsafe-reports/*.xml'
                }
            }
        }

        // 性能测试
        stage('Performance Tests') {
            steps {
                // 执行性能测试
                sh './run-performance-tests.sh'
            }
            post {
                always {
                    // 发布性能测试报告
                    publishHTML([
                        allowMissing: false,
                        alwaysLinkToLastBuild: true,
                        keepAll: true,
                        reportDir: 'performance-reports',
                        reportFiles: 'index.html',
                        reportName: 'Performance Test Report'
                    ])
                }
            }
        }

        // 集成测试环境清理
        stage('Cleanup Integration Test Env') {
            steps {
                // 清理测试环境
                sh 'docker-compose -f docker-compose-test.yml down'
            }
            // 即使前面失败也要执行清理
            post {
                always {
                    sh 'docker-compose -f docker-compose-test.yml down || true'
                }
            }
        }

        // 部署到测试环境（条件：主分支且所有测试通过）
        stage('Deploy to Test') {
            when {
                branch 'main'
                expression { currentBuild.resultIsBetterOrEqualTo('SUCCESS') }
            }
            steps {
                sh './deploy-to-test.sh'
            }
        }
    }

    // 流水线后操作
    post {
        // 成功时的操作
        success {
            echo 'Pipeline succeeded!'
            // 发送成功通知
            mail to: 'team@example.com',
                 subject: "构建成功: ${currentBuild.fullDisplayName}",
                 body: "<p>构建成功:</p><p>检查控制台输出: <a href='${BUILD_URL}'>${BUILD_URL}</a></p>"
        }

        // 失败时的操作
        failure {
            echo 'Pipeline failed!'
            // 发送失败通知
            mail to: 'team@example.com',
                 subject: "构建失败: ${currentBuild.fullDisplayName}",
                 body: "<p>构建失败:</p><p>检查控制台输出: <a href='${BUILD_URL}'>${BUILD_URL}</a></p>"
        }

        // 始终执行的操作
        always {
            // 清理工作空间
            cleanWs(cleanWhenNotBuilt: false,
                   deleteDirs: true,
                   disableDeferredWipeout: true,
                   notFailBuild: true)
        }
    }
}
