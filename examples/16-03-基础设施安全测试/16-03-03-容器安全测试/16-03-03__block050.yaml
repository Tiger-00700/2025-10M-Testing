# Kubernetes安全配置检查示例（使用kube-bench）
apiVersion: batch/v1
kind: Job
metadata:
  name: kube-bench
  namespace: security
spec:
  template:
    spec:
      hostPID: true
      containers:

        - name: kube-bench

          image: aquasec/kube-bench:latest
          command: ["kube-bench"]
          volumeMounts:

            - name: var-lib-kubelet

              mountPath: /var/lib/kubelet
              readOnly: true

            - name: etc-systemd

              mountPath: /etc/systemd
              readOnly: true

            - name: etc-kubernetes

              mountPath: /etc/kubernetes
              readOnly: true
      restartPolicy: Never
      volumes:

        - name: var-lib-kubelet

          hostPath:
            path: /var/lib/kubelet

        - name: etc-systemd

          hostPath:
            path: /etc/systemd

        - name: etc-kubernetes

          hostPath:
            path: /etc/kubernetes
---
# 容器镜像安全扫描配置（使用Trivy）
apiVersion: batch/v1
kind: Job
metadata:
  name: trivy-scan
  namespace: security
spec:
  template:
    spec:
      containers:

        - name: trivy

          image: aquasec/trivy:latest
          command: ["trivy", "image", "--severity=CRITICAL,HIGH", "--exit-code=1", "your-bigdata-image:latest"]
          env:

            - name: TRIVY_CACHE_DIR

              value: /tmp/trivy-cache
          volumeMounts:

            - name: trivy-cache

              mountPath: /tmp/trivy-cache
      restartPolicy: Never
      volumes:

        - name: trivy-cache

          emptyDir: {}
