# 质量规则（最小示例）
rules:
  - id: R001
    name: non_negative_amount
    type: constraint
    target: amount
    expression: amount >= 0
    severity: high
    on_fail: quarantine
  - id: R002
    name: currency_in_enum
    type: constraint
    target: currency
    expression: currency in {USD, EUR, CNY}
    severity: medium
    on_fail: reject
  - id: R003
    name: status_ratio_limits
    type: distribution
    target: status
    expression: P(FAILED) <= 0.02 and P(PENDING) <= 0.05
    window: P1D
    severity: medium
    on_fail: alert
