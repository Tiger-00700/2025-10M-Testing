dimensions:
  - dimension: "准确性"
    key_metrics: ["对账通过率", "字段校验通过率"]
    calculation: "校验成功数/总记录数"
    threshold: ">95%"
    frequency: "实时/每日"
  - dimension: "完整性"
    key_metrics: ["缺失率", "空值占比"]
    calculation: "空值记录数/总记录数"
    threshold: "<5%"
    frequency: "每日"
  - dimension: "一致性"
    key_metrics: ["跨表一致性通过率", "幂等一致率"]
    calculation: "一致记录数/总记录数"
    threshold: ">98%"
    frequency: "实时"
  - dimension: "及时性"
    key_metrics: ["端到端延迟", "超时率"]
    calculation: "平均延迟时间"
    threshold: "<30min"
    frequency: "实时"
  - dimension: "唯一性"
    key_metrics: ["重复率", "主键冲突比例"]
    calculation: "重复记录数/总记录数"
    threshold: "<1%"
    frequency: "每日"
  - dimension: "有效性"
    key_metrics: ["格式校验通过率", "Schema兼容性"]
    calculation: "有效记录数/总记录数"
    threshold: ">99%"
    frequency: "实时"
  - dimension: "合规性"
    key_metrics: ["脱敏覆盖率", "审计缺失数"]
    calculation: "合规记录数/总记录数"
    threshold: "100%"
    frequency: "每周"
  - dimension: "稳定性"
    key_metrics: ["告警恢复时间", "误报率"]
    calculation: "平均恢复时间"
    threshold: "<1h"
    frequency: "实时"