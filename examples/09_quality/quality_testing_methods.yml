# 数据质量测试方法与技术配置
# 锚点051 对应配置

quality_testing_methods:
  - method: 自动化脚本 (Automated Scripts)
    technologies:
      - SQL/Python脚本
      - 规则引擎
    scenarios:
      - 字段校验
      - 业务规则验证
    advantages:
      - 灵活
      - 可定制
    tools:
      - Python脚本
      - SQL查询

  - method: 规则引擎 (Rule Engine)
    technologies:
      - 模板化规则生成
      - 元数据驱动
    scenarios:
      - 批量规则配置
      - 动态规则更新
    advantages:
      - 标准化
      - 高效
    tools:
      - Apache Griffin
      - 自建规则引擎

  - method: 平台化工具 (Platform Tools)
    technologies:
      - 一体化质量平台
      - CI/CD集成
    scenarios:
      - 全链路质量门
      - 自动化部署验证
    advantages:
      - 自动化
      - 可观测
    tools:
      - Great Expectations
      - Deequ

  - method: 异常检测 (Anomaly Detection)
    technologies:
      - 统计模型
      - 机器学习算法
    scenarios:
      - 趋势告警
      - 环比监控
    advantages:
      - 智能
      - 减少误报
    tools:
      - Prophet模型
      - 自定义ML模型

  - method: 对账测试 (Reconciliation Testing)
    technologies:
      - 跨表一致性校验
      - 跨链路验证
    scenarios:
      - 批流对账
      - 端到端验证
    advantages:
      - 精准
      - 覆盖广
    tools:
      - SQL对账脚本
      - 自建对账框架

  - method: Schema校验 (Schema Validation)
    technologies:
      - 结构验证
      - 兼容性检查
    scenarios:
      - 数据格式变更
      - 接口兼容性
    advantages:
      - 预防性
      - 自动化
    tools:
      - JSON Schema
      - Avro Schema