# 数据质量工具与实践案例配置
# 锚点054 对应配置

tools_practice_cases:
  - category: 一体化平台 (Integrated Platform)
    key_features:
      - 规则配置界面
      - 自动校验执行
      - 监控告警集成
      - 血缘追溯功能
      - 问题工单管理
      - 全流程闭环
    tool_examples:
      - Apache Griffin
      - Great Expectations
      - 自建质量平台
    practice_effects:
      - 全流程自动化
      - 问题快速定位
      - 效率显著提升

  - category: 集成工具 (Integration Tools)
    key_features:
      - 与开发平台集成
      - 与调度系统集成
      - 与运维平台集成
      - 质量门自动化
      - CI/CD流水线集成
    tool_examples:
      - Deequ
      - Soda
      - 自建集成框架
    practice_effects:
      - 开发流程集成
      - 质量前置把控
      - 发布质量保障

  - category: 可视化工具 (Visualization Tools)
    key_features:
      - 质量数据数仓化
      - 实时可视化展示
      - 趋势分析图表
      - 自定义仪表盘
      - 报告自动生成
    tool_examples:
      - Tableau
      - Grafana
      - 自建可视化平台
    practice_effects:
      - 数据驱动决策
      - 问题直观展示
      - 管理层报告支持

  - category: 开源框架 (Open Source Frameworks)
    key_features:
      - 灵活配置能力
      - 社区活跃支持
      - 扩展性强
      - 定制化开发
      - 成本低廉
    tool_examples:
      - Pandera
      - PyDeequ
      - Cerberus
    practice_effects:
      - 快速原型开发
      - 社区资源丰富
      - 技术栈统一

  - category: 企业级平台 (Enterprise Platforms)
    key_features:
      - 多租户支持
      - 权限管理系统
      - 企业级稳定性
      - 大规模数据处理
      - 专业技术支持
    tool_examples:
      - Informatica
      - Talend
      - IBM InfoSphere
    practice_effects:
      - 企业级应用
      - 合规性保障
      - 规模化部署

  - category: AI增强工具 (AI-Enhanced Tools)
    key_features:
      - 智能异常检测
      - 自动修复建议
      - 预测性告警
      - 机器学习模型
      - 自适应阈值
    tool_examples:
      - 自定义ML模型
      - 基于TensorFlow的质量检测
      - AI驱动的质量平台
    practice_effects:
      - 减少人工干预
      - 提高检测精度
      - 智能化运维

practice_cases:
  - case: 互联网公司自动化对账平台实践
    description: 通过自动化对账平台，将批流链路的对账效率提升10倍，质量问题发现提前到开发阶段
    key_achievements:
      - 对账效率提升10倍
      - 质量问题前置发现
      - 开发阶段质量把控

  - case: 金融企业数据质量平台应用
    description: 引入数据质量平台，实现关键表字段级校验、趋势监控与告警收敛，质量事故率明显下降
    key_achievements:
      - 字段级校验覆盖
      - 趋势监控实现
      - 告警收敛优化
      - 质量事故率下降

  - case: 零售企业质量数据数仓化
    description: 把质量结果数仓化，按业务域监控质量SLI/SLO，问题平均恢复时间缩短一半
    key_achievements:
      - 质量数据数仓化
      - SLI/SLO监控体系
      - 问题恢复时间减半