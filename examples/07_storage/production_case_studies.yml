# production_case_studies.yml
# 存储测试生产环境案例分享配置

# 金融行业HDFS存储测试案例配置
financial_hdfs_case:
  industry: "金融行业"
  scale: "大型银行大数据平台"
  daily_data_volume: "50TB+"
  cluster_size: "1000+节点"
  requirements:
    data_consistency:
      rpo: "< 15分钟"
      rto: "< 4小时"
    availability: "7×24小时"
    compliance:
      - "数据加密"
      - "审计日志"
      - "访问控制"
  test_scenarios:
    - name: "合规数据生成测试"
      description: "生成符合金融监管要求的测试数据"
      data_types:
        - "交易记录"
        - "账户信息"
        - "合规日志"
    - name: "灾难恢复演练"
      description: "模拟数据损坏和恢复场景"
      recovery_targets:
        - "数据完整性验证"
        - "恢复时间目标"
        - "业务连续性保障"
    - name: "高频交易压力测试"
      description: "模拟高频交易数据写入负载"
      metrics:
        - "写入操作数"
        - "读取操作数"
        - "平均延迟"
        - "错误率"
  benefits:
    availability_improvement: "平均故障恢复时间从4小时降低到1.5小时"
    performance_optimization: "查询响应时间提升30%"
    compliance_assurance: "完整的审计和加密验证流程"
    cost_savings: "存储成本降低15%"

# 电商平台多云存储架构测试案例配置
ecommerce_multicloud_case:
  industry: "电商平台"
  scale: "大型电商平台"
  daily_orders: "1000万+"
  architecture: "多云存储架构 (AWS + Azure + 阿里云)"
  features:
    - name: "数据分层"
      description: "热数据存储在高性能云存储，冷数据归档到低成本存储"
    - name: "多活架构"
      description: "三个云服务商同时提供服务，支持流量自动切换"
    - name: "全球加速"
      description: "使用CDN和边缘计算提供全球访问加速"
  test_scenarios:
    - name: "全球流量模拟测试"
      description: "模拟不同地区的用户访问模式"
      regions:
        us_east_1:
          users: 1000
          orders_per_user: 2.5
        eu_west_1:
          users: 800
          orders_per_user: 2.1
        ap_southeast_1:
          users: 1200
          orders_per_user: 3.2
    - name: "跨云一致性测试"
      description: "验证多云环境下的数据一致性"
      consistency_checks:
        - "数据同步延迟"
        - "复制完整性"
        - "冲突解决机制"
  benefits:
    performance_optimization: "全球平均响应时间降低40%"
    cost_control: "存储成本优化15%"
    availability_improvement: "99.99%服务可用性"
    compliance_satisfaction: "满足GDPR等全球合规要求"

# 物联网大数据存储测试案例配置
iot_bigdata_case:
  industry: "物联网平台"
  scale: "物联网大数据平台"
  daily_data_points: "10亿+"
  architecture: "时序数据库 + 对象存储混合架构"
  tech_stack:
    time_series_db:
      - "InfluxDB"
      - "Cassandra集群"
    object_storage: "MinIO分布式对象存储"
    message_queue: "Kafka数据采集"
    stream_processing: "Flink实时分析"
  test_scenarios:
    - name: "物联网设备集群数据生成模拟"
      description: "模拟大规模物联网设备数据生成"
      parameters:
        device_count: 10000
        duration_minutes: 10
        data_types:
          - "传感器数据"
          - "网关状态"
          - "设备元数据"
    - name: "数据保留和清理测试"
      description: "测试数据生命周期管理"
      retention_policies:
        hot_data:
          retention_days: 7
          storage: "influxdb"
        warm_data:
          retention_days: 90
          storage: "minio_hot"
        cold_data:
          retention_days: 365
          storage: "minio_cold"
  benefits:
    scalability_verification: "每秒10万+数据点写入负载"
    cost_optimization: "存储成本降低60%"
    real_time_guarantee: "时序数据查询响应时间<100ms"
    data_integrity: "完整的数据血缘追踪和校验机制"

# 通用测试配置模板
test_configuration_template:
  general_settings:
    test_duration_minutes: 60
    concurrent_users: 100
    data_volume_gb: 100
    error_tolerance_percent: 0.1
  
  performance_metrics:
    throughput_target: "1000 ops/sec"
    latency_p95_target: "100ms"
    availability_target: "99.9%"
    data_integrity_target: "100%"
  
  monitoring_configuration:
    metrics_collection:
      interval_seconds: 10
      retention_days: 30
    alerting_rules:
      latency_threshold_ms: 1000
      error_rate_threshold: 0.05
      availability_threshold: 0.999
  
  reporting_format:
    summary_report: true
    detailed_metrics: true
    recommendations: true
    compliance_checklist: true

# 行业特定测试模式
industry_specific_patterns:
  financial_services:
    focus_areas:
      - "数据一致性"
      - "灾难恢复"
      - "审计合规"
      - "高可用性"
    regulatory_requirements:
      - "SOX合规"
      - "PCI DSS"
      - "数据加密标准"
  
  ecommerce:
    focus_areas:
      - "高并发处理"
      - "全球分发"
      - "成本优化"
      - "用户体验"
    key_metrics:
      - "订单处理时间"
      - "库存准确性"
      - "跨地域延迟"
  
  iot_industrial:
    focus_areas:
      - "大规模数据采集"
      - "实时处理能力"
      - "数据保留策略"
      - "设备管理"
    scalability_requirements:
      - "每秒百万级数据点"
      - "PB级数据存储"
      - "毫秒级响应"