# examples/07_storage/compression_strategy.yml
# 数据压缩策略配置示例

compression_strategy:
  # 压缩算法选择
  algorithms:
    gzip:
      compression_ratio: "high"
      cpu_usage: "medium"
      decompression_speed: "fast"
      use_case: "general_purpose"
      
    lz4:
      compression_ratio: "medium"
      cpu_usage: "low"
      decompression_speed: "very_fast"
      use_case: "real_time_processing"
      
    zstd:
      compression_ratio: "very_high"
      cpu_usage: "medium"
      decompression_speed: "fast"
      use_case: "archive_storage"
      
    snappy:
      compression_ratio: "medium"
      cpu_usage: "low"
      decompression_speed: "very_fast"
      use_case: "hadoop_ecosystem"

  # 数据类型特定策略
  data_type_strategies:
    text_data:
      primary_algorithm: "gzip"
      compression_level: 6
      adaptive_compression: true
      
    binary_data:
      primary_algorithm: "lz4"
      compression_level: 1
      adaptive_compression: false
      
    json_data:
      primary_algorithm: "zstd"
      compression_level: 3
      adaptive_compression: true
      
    parquet_files:
      primary_algorithm: "snappy"
      compression_level: 1
      adaptive_compression: false

  # 存储层级压缩
  storage_tier_compression:
    hot_storage:
      compression_enabled: false
      reason: "performance_priority"
      
    warm_storage:
      compression_enabled: true
      algorithm: "gzip"
      compression_level: 6
      
    cold_storage:
      compression_enabled: true
      algorithm: "zstd"
      compression_level: 22

  # 性能优化配置
  performance_optimization:
    parallel_compression:
      enabled: true
      thread_count: 4
      
    compression_dictionary:
      enabled: true
      dictionary_size_mb: 10
      
    adaptive_compression:
      enabled: true
      sample_size_mb: 100

  # 监控与指标
  monitoring:
    compression_ratio_tracking: true
    performance_impact_monitoring: true
    storage_savings_reporting: true