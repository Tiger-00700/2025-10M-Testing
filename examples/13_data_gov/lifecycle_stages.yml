# examples/13_data_gov/lifecycle_stages.yml
# 生命周期阶段配置

lifecycle_stages:
  generation:
    duration: "immediate"
    actions: ["validate", "classify"]
    next_stage: "usage"

  usage:
    duration: "variable"
    actions: ["monitor", "backup"]
    next_stage: "archival"

  archival:
    duration: "90_days"
    actions: ["compress", "encrypt"]
    next_stage: "deletion"

  deletion:
    duration: "permanent"
    actions: ["secure_erase", "audit"]
    next_stage: null