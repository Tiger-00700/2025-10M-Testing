# examples/13_data_gov/lifecycle_measures.yml
# 生命周期管理措施配置

lifecycle_measures:
  automation:
    enabled: true
    tools: ["jenkins", "airflow"]
    frequency: "daily"

  monitoring:
    enabled: true
    metrics: ["age", "usage", "size"]
    alerts: ["expiration_warning", "storage_full"]

  cleanup:
    strategy: "gradual"
    retention_days: 90
    approval_required: true