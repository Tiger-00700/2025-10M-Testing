# examples/13_data_gov/lifecycle_recommendations.yml
# 生命周期管理建议配置

lifecycle_recommendations:
  - recommendation: "implement_automated_cleanup"
    priority: "high"
    description: "实施自动化数据清理流程"

  - recommendation: "establish_retention_policies"
    priority: "high"
    description: "建立明确的数据保留策略"

  - recommendation: "monitor_data_usage"
    priority: "medium"
    description: "监控数据使用情况和生命周期"