# examples/13_data_gov/metrics_dashboard.yml
# 测试数据治理指标仪表板配置

dashboard:
  name: "Test Data Governance Dashboard"
  description: "监控测试数据治理效果的关键指标"
  refresh_interval: "1h"
  timezone: "Asia/Shanghai"

  # 仪表板布局
  layout:
    - row: "Overview"
      widgets:
        - type: "metric"
          title: "Total Datasets"
          metric: "datasets.total.count"
          format: "number"

        - type: "metric"
          title: "Data Quality Score"
          metric: "quality.average_score"
          format: "percentage"

        - type: "metric"
          title: "Compliance Rate"
          metric: "compliance.overall_rate"
          format: "percentage"

    - row: "Data Lifecycle"
      widgets:
        - type: "chart"
          title: "Dataset Status Distribution"
          type: "pie"
          metric: "datasets.status.*"
          labels: ["Active", "Archived", "Deleted"]

        - type: "chart"
          title: "Data Age Distribution"
          type: "histogram"
          metric: "datasets.age_distribution"
          buckets: ["0-30d", "30-90d", "90-365d", "365d+"]

    - row: "Usage & Performance"
      widgets:
        - type: "chart"
          title: "Data Reuse Rate Trend"
          type: "line"
          metric: "usage.reuse_rate"
          time_range: "30d"

        - type: "chart"
          title: "Test Execution Time"
          type: "line"
          metric: "performance.test_execution_time"
          time_range: "30d"

    - row: "Security & Compliance"
      widgets:
        - type: "chart"
          title: "Access Requests"
          type: "bar"
          metric: "security.access_requests"
          time_range: "7d"

        - type: "table"
          title: "Top Compliance Violations"
          metric: "compliance.violations"
          columns: ["Rule", "Count", "Severity"]
          limit: 10

  # 指标定义
  metrics:
    # 数据集指标
    datasets:
      total:
        count:
          query: "SELECT COUNT(*) FROM datasets"
          type: "gauge"

      status:
        active:
          query: "SELECT COUNT(*) FROM datasets WHERE status = 'active'"
          type: "gauge"
        archived:
          query: "SELECT COUNT(*) FROM datasets WHERE status = 'archived'"
          type: "gauge"
        deleted:
          query: "SELECT COUNT(*) FROM datasets WHERE status = 'deleted'"
          type: "gauge"

      age_distribution:
        query: "SELECT age_bucket, COUNT(*) FROM datasets GROUP BY age_bucket"
        type: "histogram"
        buckets: ["0-30", "30-90", "90-365", "365+"]

    # 质量指标
    quality:
      average_score:
        query: "SELECT AVG(quality_score) FROM datasets"
        type: "gauge"
        format: "percentage"

      scores_by_category:
        query: "SELECT category, AVG(quality_score) FROM datasets GROUP BY category"
        type: "breakdown"

    # 合规性指标
    compliance:
      overall_rate:
        query: "SELECT (compliant_checks * 100.0 / total_checks) FROM compliance_summary"
        type: "gauge"
        format: "percentage"

      violations:
        query: "SELECT rule_name, COUNT(*) as violation_count, severity FROM compliance_violations GROUP BY rule_name, severity ORDER BY violation_count DESC"
        type: "table"

    # 使用指标
    usage:
      reuse_rate:
        query: "SELECT AVG(reuse_count) FROM datasets WHERE created_at >= DATE_SUB(NOW(), INTERVAL 30 DAY)"
        type: "time_series"

      access_patterns:
        query: "SELECT DATE(access_time), COUNT(*) FROM data_access_logs GROUP BY DATE(access_time)"
        type: "time_series"

    # 性能指标
    performance:
      test_execution_time:
        query: "SELECT test_run_id, execution_time FROM test_runs WHERE start_time >= DATE_SUB(NOW(), INTERVAL 30 DAY)"
        type: "time_series"

      data_preparation_time:
        query: "SELECT dataset_id, preparation_time FROM data_preparation_logs"
        type: "histogram"

    # 安全指标
    security:
      access_requests:
        query: "SELECT DATE(request_time), request_type, COUNT(*) FROM access_requests GROUP BY DATE(request_time), request_type"
        type: "time_series"

      failed_access_attempts:
        query: "SELECT DATE(attempt_time), COUNT(*) FROM failed_access_attempts GROUP BY DATE(attempt_time)"
        type: "time_series"

  # 告警配置
  alerts:
    - name: "Low Compliance Rate"
      condition: "compliance.overall_rate < 95"
      severity: "critical"
      channels: ["email", "slack"]
      message: "合规率低于95%，需要立即处理"

    - name: "Data Quality Degradation"
      condition: "quality.average_score < 0.8"
      severity: "warning"
      channels: ["email"]
      message: "平均数据质量分数低于0.8"

    - name: "High Access Request Volume"
      condition: "security.access_requests > 1000"
      severity: "info"
      channels: ["slack"]
      message: "访问请求量异常，需要检查"

    - name: "Storage Capacity Warning"
      condition: "storage.used_percentage > 85"
      severity: "warning"
      channels: ["email", "slack"]
      message: "存储使用率超过85%，考虑清理或扩容"

  # 报告配置
  reports:
    daily_summary:
      schedule: "0 9 * * *"  # 每天早上9点
      recipients: ["data-governance-team@company.com"]
      format: "html"
      sections:
        - "overview_metrics"
        - "compliance_status"
        - "top_issues"

    weekly_detailed:
      schedule: "0 9 * * 1"  # 每周一早上9点
      recipients: ["management@company.com"]
      format: "pdf"
      sections:
        - "executive_summary"
        - "detailed_metrics"
        - "trend_analysis"
        - "recommendations"

  # 数据源配置
  data_sources:
    primary_database:
      type: "postgresql"
      host: "data-governance-db.company.com"
      database: "governance_metrics"
      credentials: "${DATABASE_CREDENTIALS}"

    audit_logs:
      type: "elasticsearch"
      host: "logs.company.com"
      index: "data-governance-audit-*"
      credentials: "${ELASTIC_CREDENTIALS}"

    monitoring:
      type: "prometheus"
      host: "monitoring.company.com"
      credentials: "${PROMETHEUS_CREDENTIALS}"