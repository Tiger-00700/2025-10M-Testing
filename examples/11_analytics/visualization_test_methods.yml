# 可视化测试方法配置
# 涵盖数据驱动校验、交互测试、性能评估、可访问性等维度

test_categories:
  - name: "数据驱动校验"
    description: "验证可视化组件的数据准确性和展示正确性"
    methods:
      - "已知数据集+黄金结果对比测试"
      - "坐标、比例尺、颜色编码一致性验证"
      - "数据格式转换和展示逻辑检查"
    tools: ["图像对比工具", "数据验证脚本", "视觉回归测试"]
    
  - name: "交互测试"
    description: "测试用户交互行为的正确性和流畅性"
    methods:
      - "筛选、联动、下钻、跳转功能测试"
      - "URL/书签状态恢复验证"
      - "会话状态持久化检查"
    automation:
      - "Selenium WebDriver"
      - "Playwright"
      - "Cypress"
    coverage: ["桌面端", "移动端", "平板"]
    
  - name: "性能与兼容性测试"
    description: "评估可视化性能和跨平台兼容性"
    methods:
      - "大数据量渲染性能测试"
      - "复杂联动操作响应时间测试"
      - "实时数据刷新性能评估"
      - "多终端、多浏览器兼容性验证"
    metrics:
      - "渲染FPS (Frames Per Second)"
      - "交互响应时间"
      - "内存使用率"
      - "CPU利用率"
    tools: ["Chrome DevTools", "Lighthouse", "WebPageTest"]
    
  - name: "异常与边界测试"
    description: "测试异常数据和边界条件的处理能力"
    methods:
      - "空数据、缺失数据处理测试"
      - "重复数据、极值数据展示测试"
      - "异常格式数据容错机制验证"
      - "权限不足、网络异常降级测试"
    scenarios:
      - "数据加载失败"
      - "网络超时"
      - "权限被拒绝"
      - "后台服务异常"
    
  - name: "可访问性测试"
    description: "确保可视化内容对所有用户都可访问"
    standards: ["WCAG 2.1 AA", "Section 508"]
    methods:
      - "对比度检查"
      - "键盘导航测试"
      - "读屏软件兼容性验证"
      - "颜色盲用户测试"
    tools: ["axe-core", "WAVE", "NVDA", "JAWS"]

# 自动化测试配置
automation_config:
  framework: "Playwright + Visual Regression"
  browser_support: ["Chrome", "Firefox", "Safari", "Edge"]
  device_emulation: ["Desktop", "Tablet", "Mobile"]
  ci_integration: "GitHub Actions"

# 质量标准
quality_standards:
  performance:
    fps_threshold: 30
    response_time_threshold: "2秒"
  accessibility:
    wcag_compliance: "AA级"
    keyboard_navigation: "100%覆盖"
  compatibility:
    browser_support: "现代浏览器"
    mobile_support: "响应式设计"