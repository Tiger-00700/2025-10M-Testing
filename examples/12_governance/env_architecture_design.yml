# 多环境架构设计要点配置
# 对应锚点12-001: 多环境架构设计要点表格

environments:
  - name: development
    purpose: 个人/小组开发与调试
    resources: 资源灵活，按需分配
    data: 脱敏/模拟数据
    frequency: 高频变更
    focus: 功能验证、代码质量

  - name: testing
    purpose: 功能、集成、回归测试
    resources: 稳定隔离，预留资源
    data: 还原业务链路
    frequency: 中等频率
    focus: 功能完整性、接口兼容

  - name: staging
    purpose: 上线前全链路验证
    resources: 高保真，生产规格
    data: 生产影子数据
    frequency: 低频变更
    focus: 性能压测、生产一致性

  - name: production
    purpose: 正式业务运行
    resources: 高可用、高安全
    data: 真实业务数据
    frequency: 受控变更
    focus: 稳定性、可用性、监控

  - name: disaster_recovery
    purpose: 故障演练、灾备验证
    resources: 按需创建，临时资源
    data: 生产镜像数据
    frequency: 按需变更
    focus: 容灾能力、应急响应

# 设计原则
principles:
  - 环境物理或逻辑隔离，避免数据串扰和权限越界
  - 配置、数据、权限、监控等可按环境灵活切换
  - 支持一键环境切换和快速回滚
  - 环境基线可追踪、可对账，避免配置漂移
  - 对"生产影子"数据采用脱敏/伪造/抽样，保障合规同时保持口径代表性
  - IaC/GitOps驱动变更，所有环境改动可审计、可回滚