# examples/12_governance/access_control.yml
# 测试数据访问控制配置示例

access_control:
  # 基于角色的访问控制 (RBAC)
  roles:
    data_owner:
      permissions:
        - read
        - write
        - delete
        - grant_access
      scope: "full_dataset"
      
    data_steward:
      permissions:
        - read
        - write
        - approve_changes
      scope: "assigned_domains"
      
    data_consumer:
      permissions:
        - read
      scope: "approved_datasets"
      
    auditor:
      permissions:
        - read_audit_logs
        - generate_reports
      scope: "all_audit_data"

  # 数据分类与访问级别
  data_classification:
    public:
      access_level: "unrestricted"
      retention_days: 365
      
    internal:
      access_level: "role_based"
      retention_days: 1095
      
    confidential:
      access_level: "need_to_know"
      retention_days: 2555
      
    restricted:
      access_level: "explicit_approval"
      retention_days: 3650

  # 访问控制规则
  access_rules:
    - rule_id: "rule_001"
      condition: "user_role == 'data_owner'"
      action: "allow_full_access"
      
    - rule_id: "rule_002"
      condition: "data_classification == 'restricted'"
      action: "require_approval"
      
    - rule_id: "rule_003"
      condition: "access_time outside business_hours"
      action: "require_justification"

  # 审计配置
  audit:
    enabled: true
    log_level: "detailed"
    retention_days: 2555
    alert_on_suspicious_activity: true