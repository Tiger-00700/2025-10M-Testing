# examples/21_project/project_initiation.yml
project_initiation:
  # 项目基本信息
  project_info:
    name: "大数据平台升级项目"
    code: "BDP_UPGRADE_2025"
    type: "platform_upgrade"
    priority: "high"
    sponsor: "CTO"
    project_manager: "测试总监"

  # 项目目标
  objectives:
    business_goals:
      - "提升数据处理时效性30%"
      - "降低数据质量问题率50%"
      - "优化用户数据体验"
    technical_goals:
      - "实现流批一体架构"
      - "提升系统可用性至99.9%"
      - "建立自动化测试体系"
    quality_goals:
      - "测试覆盖率≥90%"
      - "缺陷逃逸率≤1%"
      - "性能基准达成率100%"

  # 项目范围
  scope:
    in_scope:
      - "数据采集链路升级"
      - "存储层架构优化"
      - "计算引擎迁移"
      - "测试环境重构"
    out_scope:
      - "业务应用系统改造"
      - "第三方系统集成"
      - "生产环境网络调整"
    assumptions:
      - "现有数据格式保持兼容"
      - "关键接口保持稳定"
      - "业务团队全力配合"

  # 干系人管理
  stakeholders:
    business_owners:
      - name: "业务总监"
        role: "需求确认与验收"
        contact: "business@company.com"
    technical_leads:
      - name: "架构师"
        role: "技术方案设计"
        contact: "architect@company.com"
    testing_team:
      - name: "测试经理"
        role: "测试策略制定"
        contact: "testmgr@company.com"
    operations_team:
      - name: "运维总监"
        role: "环境与发布支持"
        contact: "ops@company.com"

  # 风险识别
  risks:
    high_risk:
      - risk: "数据迁移失败"
        impact: "high"
        probability: "medium"
        mitigation: "制定详细迁移计划和回滚方案"
      - risk: "性能达不到要求"
        impact: "high"
        probability: "medium"
        mitigation: "提前进行性能测试和优化"
    medium_risk:
      - risk: "需求理解偏差"
        impact: "medium"
        probability: "high"
        mitigation: "加强需求澄清和评审机制"

  # 里程碑计划
  milestones:
    phase1:
      name: "需求澄清与设计"
      duration: "2周"
      deliverables:
        - "需求规格说明书"
        - "技术设计方案"
        - "测试策略文档"
      acceptance_criteria:
        - "所有需求点得到确认"
        - "技术方案获得评审通过"
    phase2:
      name: "开发与测试"
      duration: "6周"
      deliverables:
        - "可测试的系统版本"
        - "测试用例集"
        - "测试报告"
      acceptance_criteria:
        - "功能测试通过率≥95%"
        - "性能指标达到要求"

  # 资源需求
  resources:
    personnel:
      testing_team: 5
      development_team: 8
      operations_team: 3
    environment:
      dev_env: 1
      test_env: 2
      staging_env: 1
    budget:
      estimated_cost: 500000
      contingency: 20

  # 沟通计划
  communication_plan:
    meetings:
      - type: "周例会"
        frequency: "weekly"
        attendees: "all_stakeholders"
      - type: "里程碑评审"
        frequency: "per_milestone"
        attendees: "key_stakeholders"
    reports:
      - type: "周报"
        frequency: "weekly"
        audience: "all_team"
      - type: "月报"
        frequency: "monthly"
        audience: "management"