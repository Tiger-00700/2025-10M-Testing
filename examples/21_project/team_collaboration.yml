# examples/21_project/team_collaboration.yml
team_collaboration:
  # 团队结构与角色
  team_structure:
    project_roles:
      - role: "项目经理"
        responsibilities:
          - "项目计划制定与跟踪"
          - "资源协调与风险管理"
          - "干系人沟通与汇报"
        authority_level: "high"
        key_competencies: ["项目管理", "沟通协调", "风险管理"]

      - role: "测试经理"
        responsibilities:
          - "测试策略制定与执行"
          - "测试团队管理与指导"
          - "质量把控与过程改进"
        authority_level: "high"
        key_competencies: ["测试管理", "质量 assurance", "团队领导"]

      - role: "高级测试工程师"
        responsibilities:
          - "复杂测试场景设计"
          - "自动化框架开发"
          - "技术难题解决"
        authority_level: "medium"
        key_competencies: ["测试设计", "自动化技术", "问题分析"]

      - role: "测试工程师"
        responsibilities:
          - "测试用例执行"
          - "缺陷发现与跟踪"
          - "测试数据准备"
        authority_level: "medium"
        key_competencies: ["测试执行", "缺陷管理", "工具使用"]

      - role: "业务分析师"
        responsibilities:
          - "需求分析与澄清"
          - "验收标准定义"
          - "业务知识传递"
        authority_level: "medium"
        key_competencies: ["业务分析", "需求管理", "用户体验"]

    raci_matrix:
      activities:
        - activity: "需求评审"
          responsible: "业务分析师"
          accountable: "项目经理"
          consulted: "测试经理,开发经理"
          informed: "测试团队"

        - activity: "测试计划制定"
          responsible: "测试经理"
          accountable: "项目经理"
          consulted: "业务分析师,开发经理"
          informed: "测试团队"

        - activity: "缺陷管理"
          responsible: "测试工程师"
          accountable: "测试经理"
          consulted: "开发工程师"
          informed: "项目经理"

  # 沟通机制
  communication_mechanisms:
    regular_meetings:
      - meeting: "每日站会"
        frequency: "daily"
        duration: "15分钟"
        attendees: "测试团队全体"
        agenda: ["昨日完成", "今日计划", "阻塞问题"]
        format: "站立会议"

      - meeting: "测试周会"
        frequency: "weekly"
        duration: "1小时"
        attendees: "测试团队+项目经理"
        agenda: ["进度回顾", "质量指标", "风险识别", "计划调整"]
        format: "正式会议"

      - meeting: "项目协调会"
        frequency: "bi-weekly"
        duration: "1.5小时"
        attendees: "跨部门代表"
        agenda: ["项目状态", "依赖协调", "问题解决", "里程碑确认"]
        format: "正式会议"

    communication_channels:
      - channel: "即时消息群"
        purpose: "日常沟通与快速响应"
        tools: ["Slack", "Teams", "微信企业版"]
        guidelines: ["及时响应", "避免信息过载", "重要信息书面确认"]

      - channel: "邮件列表"
        purpose: "正式通知与文档共享"
        tools: ["Outlook", "Gmail"]
        guidelines: ["明确主题", "控制收件人范围", "重要附件标注"]

      - channel: "项目管理平台"
        purpose: "任务跟踪与进度管理"
        tools: ["JIRA", "Azure DevOps", "Trello"]
        guidelines: ["及时更新状态", "清晰描述任务", "合理分配负责人"]

    reporting_structure:
      daily_reports:
        - report: "测试执行日报"
          audience: "测试团队"
          content: ["执行进度", "发现缺陷", "阻塞问题"]
          format: "邮件/工具更新"

      weekly_reports:
        - report: "测试周报"
          audience: "项目组全体"
          content: ["进度概览", "质量指标", "风险状态", "下周计划"]
          format: "PPT演示"

      milestone_reports:
        - report: "里程碑报告"
          audience: "管理层"
          content: ["达成情况", "质量评估", "经验总结", "后续计划"]
          format: "正式文档"

  # 协作流程
  collaboration_processes:
    requirement_management:
      process_steps:
        - step: "需求收集"
          owner: "业务分析师"
          input: "业务需求文档"
          output: "需求规格说明"
          review_points: ["完整性", "可测试性", "优先级"]

        - step: "需求评审"
          owner: "测试经理"
          input: "需求规格说明"
          output: "评审意见"
          participants: ["开发", "测试", "业务", "运维"]

        - step: "需求确认"
          owner: "项目经理"
          input: "评审意见汇总"
          output: "确认的需求基线"
          approval_required: true

    defect_management:
      process_steps:
        - step: "缺陷发现"
          owner: "测试工程师"
          input: "测试执行结果"
          output: "缺陷报告"
          criteria: ["重现步骤", "环境信息", "严重程度"]

        - step: "缺陷 triage"
          owner: "测试经理"
          input: "缺陷报告"
          output: "缺陷分类与分配"
          participants: ["开发负责人", "产品负责人"]

        - step: "缺陷修复"
          owner: "开发工程师"
          input: "缺陷分配结果"
          output: "修复代码"
          time_limits: {"critical": "4小时", "high": "1天", "medium": "3天"}

        - step: "缺陷验证"
          owner: "测试工程师"
          input: "修复代码"
          output: "验证结果"
          criteria: ["修复正确性", "回归影响", "文档更新"]

    release_coordination:
      process_steps:
        - step: "发布计划制定"
          owner: "项目经理"
          input: "里程碑达成情况"
          output: "发布计划"
          coordination_points: ["发布时间", "回滚计划", "沟通计划"]

        - step: "预发布验证"
          owner: "测试团队"
          input: "发布包"
          output: "发布验证报告"
          checklists: ["功能验证", "性能验证", "安全检查"]

        - step: "发布执行"
          owner: "运维团队"
          input: "发布验证报告"
          output: "发布结果"
          rollback_criteria: ["严重缺陷", "性能异常", "业务影响"]

  # 冲突解决机制
  conflict_resolution:
    conflict_types:
      - type: "技术分歧"
        examples: ["测试方法选择", "工具选型", "架构决策"]
        resolution_process: ["问题澄清", "方案评估", "数据驱动决策", "上级仲裁"]

      - type: "资源冲突"
        examples: ["环境竞争", "人员调度", "时间安排"]
        resolution_process: ["需求评估", "优先级排序", "资源协调", "妥协方案"]

      - type: "沟通障碍"
        examples: ["信息不对称", "期望不一致", "责任不清"]
        resolution_process: ["澄清沟通", "统一认识", "明确责任", "跟踪反馈"]

    escalation_process:
      levels:
        - level: "团队内部解决"
          timeframe: "1天"
          participants: "冲突相关方"
          decision_making: "协商一致"

        - level: "上级协调"
          timeframe: "2天"
          participants: "直属上级"
          decision_making: "上级裁决"

        - level: "管理层介入"
          timeframe: "3天"
          participants: "部门经理"
          decision_making: "管理决策"

  # 知识共享与学习
  knowledge_sharing:
    mechanisms:
      - mechanism: "技术分享会"
        frequency: "monthly"
        format: "研讨会"
        topics: ["新技术", "最佳实践", "经验教训"]

      - mechanism: "结对编程"
        frequency: "weekly"
        format: "实践指导"
        benefits: ["技能传承", "代码质量", "团队凝聚"]

      - mechanism: "文档知识库"
        frequency: "continuous"
        format: "在线文档"
        categories: ["测试用例", "自动化脚本", "故障排查", "最佳实践"]

    learning_development:
      training_programs:
        - program: "新员工入职培训"
          duration: "2周"
          content: ["公司文化", "业务知识", "技术栈", "测试流程"]

        - program: "技能提升培训"
          duration: "ongoing"
          content: ["新技术学习", "认证考试", "外部培训"]

        - program: "领导力发展"
          duration: "annual"
          content: ["团队管理", "沟通技巧", "项目管理"]

    performance_evaluation:
      metrics:
        - metric: "个人贡献度"
          indicators: ["任务完成率", "质量达标率", "团队协作度"]

        - metric: "技能成长"
          indicators: ["新技术掌握", "问题解决能力", "知识分享"]

        - metric: "领导力发展"
          indicators: ["团队满意度", "指导效果", "创新贡献"]