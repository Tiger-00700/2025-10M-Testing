# examples/20_evolution/aws_eks_deployment.yml
apiVersion: v1
kind: ConfigMap
metadata:
  name: streaming-batch-config
  namespace: data-platform
data:
  flink-config.yaml: |
    jobmanager.rpc.address: flink-jobmanager
    taskmanager.numberOfTaskSlots: 4
    parallelism.default: 4
    state.backend: rocksdb
    state.checkpoints.dir: s3://streaming-batch-checkpoints/
    state.savepoints.dir: s3://streaming-batch-savepoints/

  spark-config.yaml: |
    spark.master: k8s://https://kubernetes.default.svc
    spark.kubernetes.container.image: 123456789012.dkr.ecr.us-east-1.amazonaws.com/streaming-batch-spark:3.3.0
    spark.kubernetes.authenticate.driver.serviceAccountName: spark-sa
    spark.dynamicAllocation.enabled: true
    spark.shuffle.service.enabled: true
    spark.hadoop.fs.s3a.accessKeyId: ${AWS_ACCESS_KEY_ID}
    spark.hadoop.fs.s3a.secretKey: ${AWS_SECRET_ACCESS_KEY}

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: flink-sa
  namespace: data-platform
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/flink-service-role

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flink-jobmanager
  namespace: data-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flink-jobmanager
  template:
    metadata:
      labels:
        app: flink-jobmanager
    spec:
      serviceAccountName: flink-sa
      containers:
      - name: jobmanager
        image: 123456789012.dkr.ecr.us-east-1.amazonaws.com/streaming-batch-flink:1.17.0
        ports:
        - containerPort: 8081
          name: webui
        - containerPort: 6123
          name: rpc
        env:
        - name: JOB_MANAGER_RPC_ADDRESS
          value: flink-jobmanager
        - name: AWS_REGION
          value: "us-east-1"
        volumeMounts:
        - name: flink-config
          mountPath: /opt/flink/conf/flink-conf.yaml
          subPath: flink-conf.yaml
        resources:
          requests:
            memory: "4Gi"
            cpu: "2000m"
          limits:
            memory: "8Gi"
            cpu: "4000m"
      volumes:
      - name: flink-config
        configMap:
          name: streaming-batch-config

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flink-taskmanager
  namespace: data-platform
spec:
  replicas: 3
  selector:
    matchLabels:
      app: flink-taskmanager
  template:
    metadata:
      labels:
        app: flink-taskmanager
    spec:
      serviceAccountName: flink-sa
      containers:
      - name: taskmanager
        image: 123456789012.dkr.ecr.us-east-1.amazonaws.com/streaming-batch-flink:1.17.0
        ports:
        - containerPort: 6121
          name: data
        - containerPort: 6122
          name: ipc
        env:
        - name: JOB_MANAGER_RPC_ADDRESS
          value: flink-jobmanager
        - name: AWS_REGION
          value: "us-east-1"
        volumeMounts:
        - name: flink-config
          mountPath: /opt/flink/conf/flink-conf.yaml
          subPath: flink-conf.yaml
        resources:
          requests:
            memory: "8Gi"
            cpu: "4000m"
          limits:
            memory: "16Gi"
            cpu: "8000m"
      volumes:
      - name: flink-config
        configMap:
          name: streaming-batch-config