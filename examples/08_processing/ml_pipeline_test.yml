        - data_integrity_checker: "数据完整性检查器"

    model_effectiveness_robustness:
      description: "模型效果与稳健性测试"
      methods:
        - performance_metrics_evaluation: "性能指标评估"
        - adversarial_sample_testing: "对抗样本测试"
        - robustness_validation: "鲁棒性验证"
        - bias_fairness_assessment: "偏差公平性评估"
