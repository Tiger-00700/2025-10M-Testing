test_methods:
  - category: "性能基准测试"
    key_metrics: ["执行时间、吞吐量、资源利用率"]
    test_points: ["输入规模放大、瓶颈识别"]
    tools_methods: ["基准测试工具"]
  - category: "扩展性验证"
    key_metrics: ["节点/分区扩展、自动扩缩容"]
    test_points: ["负载均衡、热点处理"]
    tools_methods: ["扩展模拟器"]
  - category: "压力测试"
    key_metrics: ["高并发、峰值负载"]
