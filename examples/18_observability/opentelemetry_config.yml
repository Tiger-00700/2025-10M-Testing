# examples/17_observability/opentelemetry_config.yml
# OpenTelemetry Collector配置示例 - 统一可观测性数据收集

receivers:
  # OTLP协议接收器 - 标准化的遥测数据接收
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

  # Prometheus指标接收器
  prometheus:
    config:
      global:
        scrape_interval: 15s
      scrape_configs:
        - job_name: 'bigdata-services'
          scrape_interval: 15s
          static_configs:
            - targets: ['localhost:9090', 'spark-master:9090', 'hadoop-namenode:9870']
          metrics_path: '/metrics'
          params:
            format: ['prometheus']

        - job_name: 'kubernetes-services'
          kubernetes_sd_configs:
            - role: pod
          relabel_configs:
            - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
              action: keep
              regex: true
            - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
              action: replace
              target_label: __metrics_path__
              regex: (.+)
            - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
              action: replace
              regex: ([^:]+)(?::\d+)?;(\d+)
              replacement: $1:$2
              target_label: __address__

  # Jaeger追踪数据接收器
  jaeger:
    protocols:
      grpc:
        endpoint: 0.0.0.0:14250
      thrift_http:
        endpoint: 0.0.0.0:14268

  # 系统指标接收器
  hostmetrics:
    collection_interval: 30s
    scrapers:
      cpu:
      memory:
      disk:
      network:
      filesystem:
        include_mount_points:
          match: "^/(|/[^/]+)$"
        include_mount_point_types:
          match: "^(ext4|ntfs|xfs|btrfs)$"

processors:
  # 批处理处理器 - 提高效率
  batch:
    timeout: 1s
    send_batch_size: 1024

  # 资源检测处理器 - 自动添加资源属性
  resourcedetection:
    detectors: ["env", "system", "docker", "kubernetes"]
    timeout: 5s

  # 指标聚合处理器
  aggregatormetric:
    metrics:
      - name: "cpu_usage_percent"
        description: "CPU usage percentage"
        aggregations:
          - type: "gauge"
            value: "cpu.utilization"
      - name: "memory_usage_percent"
        description: "Memory usage percentage"
        aggregations:
          - type: "gauge"
            value: "memory.utilization"

  # 属性处理器 - 添加或修改属性
  attributes:
    actions:
      - key: "service.namespace"
        action: "insert"
        value: "bigdata-testing"
      - key: "environment"
        action: "insert"
        value: "testing"

exporters:
  # Prometheus导出器
  prometheus:
    endpoint: "0.0.0.0:8889"
    namespace: "bigdata_testing"
    const_labels:
      cluster: "test-cluster"

  # Jaeger导出器
  jaeger:
    endpoint: "jaeger:14268"
    tls:
      insecure: true

  # Elasticsearch导出器 - 用于日志和指标存储
  elasticsearch:
    endpoints: ["http://elasticsearch:9200"]
    index: "bigdata-telemetry-%{+yyyy.MM.dd}"
    mapping:
      mode: "ecs"

  # 文件导出器 - 用于调试
  file:
    path: "/tmp/otel-collector-output.json"

service:
  pipelines:
    # 指标管道
    metrics:
      receivers: [otlp, prometheus, hostmetrics]
      processors: [resourcedetection, attributes, aggregatormetric, batch]
      exporters: [prometheus, elasticsearch]

    # 追踪管道
    traces:
      receivers: [otlp, jaeger]
      processors: [resourcedetection, attributes, batch]
      exporters: [jaeger, elasticsearch]

    # 日志管道
    logs:
      receivers: [otlp]
      processors: [resourcedetection, attributes, batch]
      exporters: [elasticsearch, file]

  # 遥测配置
  telemetry:
    logs:
      level: "info"
    metrics:
      address: "0.0.0.0:8888"