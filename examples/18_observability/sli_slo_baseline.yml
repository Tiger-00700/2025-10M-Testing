# examples/17_observability/sli_slo_baseline.yml
# SLI/SLO基线配置示例

sli_slo_baseline:
  # 服务级别指标 (SLI) 定义
  slis:
    availability:
      name: "服务可用性"
      description: "服务正常运行时间比例"
      formula: "uptime / total_time"
      unit: "percentage"
      measurement: "http_status < 500"
      good_events: "successful_requests"
      total_events: "total_requests"

    latency:
      name: "请求延迟"
      description: "请求响应时间"
      formula: "percentile(response_time, 95)"
      unit: "milliseconds"
      measurement: "response_time <= target"
      target_value: 100
      buckets: [10, 50, 100, 200, 500, 1000]

    throughput:
      name: "吞吐量"
      description: "系统处理能力"
      formula: "requests_per_second"
      unit: "requests/second"
      measurement: "request_rate >= target"
      target_value: 1000

    error_rate:
      name: "错误率"
      description: "请求失败比例"
      formula: "failed_requests / total_requests"
      unit: "percentage"
      measurement: "error_rate <= target"
      target_value: 0.01

    data_freshness:
      name: "数据新鲜度"
      description: "数据更新延迟"
      formula: "max(data_age)"
      unit: "minutes"
      measurement: "data_age <= target"
      target_value: 15

  # 服务级别目标 (SLO) 定义
  slos:
    availability_slo:
      sli: "availability"
      target: 0.999  # 99.9% uptime
      window: "30d"
      burn_rate_thresholds:
        - threshold: 2
          period: "1h"
        - threshold: 5.2
          period: "6h"

    latency_slo:
      sli: "latency"
      target: 0.95  # 95% of requests < 100ms
      window: "7d"
      burn_rate_thresholds:
        - threshold: 2
          period: "1h"
        - threshold: 10
          period: "6h"

    error_budget:
      total_budget: 0.001  # 0.1% error budget
      consumed_budget: 0.0005  # 50% consumed
      remaining_budget: 0.0005
      burn_rate: 0.5  # 0.5% per day

  # SLO目标分级
  slo_targets:
    critical:
      availability: 0.9999  # 99.99%
      latency_p95: 50  # ms
      error_rate: 0.0001  # 0.01%
      description: "核心业务服务"

    important:
      availability: 0.999  # 99.9%
      latency_p95: 100  # ms
      error_rate: 0.001  # 0.1%
      description: "重要业务服务"

    standard:
      availability: 0.99  # 99%
      latency_p95: 500  # ms
      error_rate: 0.01  # 1%
      description: "标准业务服务"

  # 错误预算管理
  error_budget_management:
    calculation:
      total_budget: "1 - slo_target"
      consumed_budget: "1 - actual_sli"
      remaining_budget: "total_budget - consumed_budget"

    alerting:
      warning_threshold: 0.8  # 80% budget consumed
      critical_threshold: 0.95  # 95% budget consumed

    actions:
      - threshold: 0.5
        action: "监控增强"
        description: "增加监控频率和粒度"
      - threshold: 0.8
        action: "功能冻结"
        description: "停止新功能发布"
      - threshold: 0.95
        action: "紧急响应"
        description: "启动紧急修复流程"

  # SLI/SLO监控仪表板配置
  dashboard_config:
    panels:
      - title: "服务可用性"
        type: "gauge"
        query: "up{job='api-server'}"
        thresholds:
          - value: 0.999
            color: "green"
          - value: 0.99
            color: "yellow"
          - value: 0.95
            color: "red"

      - title: "请求延迟分布"
        type: "histogram"
        query: "histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m]))"
        buckets: [0.1, 0.5, 1, 2, 5, 10]

      - title: "错误预算消耗"
        type: "time_series"
        query: "1 - (rate(http_requests_total{status=~'5..'}[30d]) / rate(http_requests_total[30d])) / 0.001"
        unit: "percent"

    alerts:
      - name: "SLO Violation"
        condition: "error_budget_consumed > 0.95"
        severity: "critical"
        message: "错误预算消耗超过95%，需要立即采取行动"

      - name: "SLO Warning"
        condition: "error_budget_consumed > 0.8"
        severity: "warning"
        message: "错误预算消耗超过80%，请关注"</content>
