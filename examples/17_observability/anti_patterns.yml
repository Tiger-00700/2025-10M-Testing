# examples/17_observability/anti_patterns.yml
# 可观测性反模式识别配置

anti_patterns:
  # 指标相关反模式
  metrics_anti_patterns:
    missing_baselines:
      description: "缺少基线指标，无法判断异常"
      symptoms:
        - 无法区分正常波动和异常
        - 告警频繁误报
        - 性能问题诊断困难
      solutions:
        - 建立历史基线数据
        - 使用统计方法计算正常范围
        - 实施渐进式阈值调整

    over_monitoring:
      description: "过度监控，指标过多导致噪音"
      symptoms:
        - 告警风暴
        - 监控系统性能下降
        - 运维人员疲劳
      solutions:
        - 实施指标分层管理
        - 使用复合指标替代多个单一指标
        - 定期review和清理无用指标

    meaningless_metrics:
      description: "指标没有实际业务价值"
      symptoms:
        - 指标与业务目标不相关
        - 无法驱动改进决策
        - 维护成本高收益低
      solutions:
        - 基于业务目标定义指标
        - 实施指标价值评估
        - 定期清理低价值指标

  # 日志相关反模式
  logging_anti_patterns:
    log_spam:
      description: "日志垃圾信息过多"
      symptoms:
        - 日志量巨大影响性能
        - 重要信息被淹没
        - 存储成本高昂
      solutions:
        - 实施日志级别管理
        - 使用采样技术
        - 定期清理过期日志

    unstructured_logs:
      description: "日志格式不规范"
      symptoms:
        - 日志解析困难
        - 查询效率低下
        - 自动化分析无法实施
      solutions:
        - 采用结构化日志格式
        - 定义日志schema
        - 使用日志聚合器标准化格式

    missing_context:
      description: "日志缺少必要上下文"
      symptoms:
        - 问题定位困难
        - 无法关联相关事件
        - 调试效率低下
      solutions:
        - 添加请求ID和追踪ID
        - 包含用户和会话信息
        - 记录关键业务参数

  # 追踪相关反模式
  tracing_anti_patterns:
    full_tracing:
      description: "100%追踪导致性能问题"
      symptoms:
        - 系统性能显著下降
        - 存储成本剧增
        - 追踪数据过多难以分析
      solutions:
        - 实施智能采样策略
        - 使用自适应采样
        - 基于业务重要性采样

    trace_fragmentation:
      description: "追踪数据不完整"
      symptoms:
        - 无法获得端到端视图
        - 跨服务问题定位困难
        - 追踪数据缺失
      solutions:
        - 确保所有服务接入追踪
        - 实施追踪数据完整性检查
        - 使用追踪代理补充数据

    trace_noise:
      description: "追踪数据包含过多噪音"
      symptoms:
        - 重要追踪被淹没
        - 分析效率低下
        - 存储浪费
      solutions:
        - 定义追踪过滤规则
        - 使用标签系统分类追踪
        - 实施追踪数据清理策略

  # 告警相关反模式
  alerting_anti_patterns:
    alert_fatigue:
      description: "告警疲劳，运维人员麻木"
      symptoms:
        - 告警响应率下降
        - 重要告警被忽略
        - 团队士气低落
      solutions:
        - 实施告警分级管理
        - 减少误报和无效告警
        - 建立告警升级机制

    alert_storm:
      description: "告警风暴，短时间内大量告警"
      symptoms:
        - 运维人员应接不暇
        - 重要告警被淹没
        - 系统响应延迟
      solutions:
        - 实施告警聚合和去重
        - 使用告警抑制规则
        - 优化告警阈值设置

    missing_alerts:
      description: "重要问题没有告警"
      symptoms:
        - 问题发现延迟
        - 影响范围扩大
        - 用户体验受损
      solutions:
        - 完善告警规则覆盖
        - 实施多维度告警
        - 定期review告警规则

  # 组织和流程反模式
  organizational_anti_patterns:
    siloed_monitoring:
      description: "各部门监控系统割裂"
      symptoms:
        - 问题跨部门难以协调
        - 数据孤岛现象严重
        - 整体视图缺失
      solutions:
        - 建立统一监控平台
        - 实施跨部门协作机制
        - 共享监控数据和见解

    reactive_monitoring:
      description: "被动监控，缺乏主动性"
      symptoms:
        - 问题总是事后发现
        - 缺乏预测性维护
        - 应急响应频繁
      solutions:
        - 实施主动监控策略
        - 使用预测性分析
        - 建立监控驱动的开发流程

  # 检测和修复配置
  detection_rules:
    - name: "high_error_rate"
      condition: "error_rate > 0.05 for 5m"
      anti_pattern: "missing_alerts"
      severity: "critical"

    - name: "log_volume_spike"
      condition: "log_rate > baseline * 2 for 10m"
      anti_pattern: "log_spam"
      severity: "warning"

    - name: "trace_sampling_too_high"
      condition: "trace_sampling_rate > 0.5"
      anti_pattern: "full_tracing"
      severity: "warning"

  remediation_actions:
    - anti_pattern: "missing_baselines"
      actions:
        - "建立指标基线数据收集"
        - "实施统计异常检测"
        - "配置动态阈值"

    - anti_pattern: "alert_fatigue"
      actions:
        - "审核和清理告警规则"
        - "实施告警聚合机制"
        - "建立告警升级流程"

    - anti_pattern: "log_spam"
      actions:
        - "调整日志级别配置"
        - "实施日志采样策略"
        - "优化日志输出格式"</content>
