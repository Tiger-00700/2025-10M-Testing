# 数据契约示例配置
# Data Contract Example Configuration

# 数据契约定义了数据提供者和消费者之间的协议
# 确保数据质量、一致性和可靠性

data_contract:
  # 契约基本信息
  metadata:
    name: "user_behavior_analytics_contract"
    version: "1.0.0"
    description: "用户行为分析数据契约"
    owner: "data_engineering_team"
    created_at: "2025-01-01"
    updated_at: "2025-01-01"

  # 数据提供者信息
  provider:
    name: "user_events_service"
    team: "platform_team"
    contact: "platform@company.com"
    sla:
      availability: "99.9%"
      latency: "< 100ms"
      data_freshness: "< 5min"

  # 数据消费者信息
  consumers:
    - name: "analytics_dashboard"
      team: "analytics_team"
      purpose: "real-time user behavior analysis"
    - name: "recommendation_engine"
      team: "ml_team"
      purpose: "personalized recommendations"

  # 数据模式定义
  schema:
    type: "object"
    properties:
      user_id:
        type: "string"
        description: "用户唯一标识"
        pattern: "^[a-zA-Z0-9_-]{8,32}$"
        required: true

      event_type:
        type: "string"
        description: "事件类型"
        enum: ["page_view", "click", "purchase", "search", "login", "logout"]
        required: true

      event_data:
        type: "object"
        description: "事件具体数据"
        properties:
          page_url:
            type: "string"
            format: "uri"
          product_id:
            type: "string"
          search_query:
            type: "string"
          timestamp:
            type: "string"
            format: "date-time"
            required: true

      session_id:
        type: "string"
        description: "会话标识"
        pattern: "^session_[a-zA-Z0-9]{16}$"

      user_agent:
        type: "string"
        description: "用户代理字符串"

      ip_address:
        type: "string"
        description: "IP地址"
        format: "ipv4"

    required:
      - "user_id"
      - "event_type"
      - "event_data"

  # 数据质量规则
  quality_rules:
    # 完整性检查
    completeness:
      - field: "user_id"
        rule: "not_null"
        severity: "error"
      - field: "event_type"
        rule: "not_null"
        severity: "error"
      - field: "event_data.timestamp"
        rule: "not_null"
        severity: "error"

    # 准确性检查
    accuracy:
      - field: "user_id"
        rule: "format_check"
        pattern: "^[a-zA-Z0-9_-]{8,32}$"
        severity: "error"
      - field: "event_data.timestamp"
        rule: "date_format"
        format: "ISO8601"
        severity: "warning"

    # 一致性检查
    consistency:
      - rule: "referential_integrity"
        fields: ["user_id", "session_id"]
        description: "用户ID和会话ID必须对应有效用户"
        severity: "error"

    # 时效性检查
    timeliness:
      - field: "event_data.timestamp"
        rule: "max_age"
        max_age_hours: 24
        severity: "warning"

  # 数据量预期
  volume_expectations:
    daily_volume:
      min: 1000000  # 每天至少100万条记录
      max: 10000000 # 每天最多1000万条记录
      unit: "records"

    peak_hourly_rate:
      max: 10000   # 峰值小时最多1万条/小时
      unit: "records_per_hour"

  # 数据分区策略
  partitioning:
    strategy: "time_based"
    partition_key: "event_data.timestamp"
    granularity: "hourly"  # 按小时分区
    retention_period: "90days"

  # 数据安全要求
  security:
    encryption:
      at_rest: true
      in_transit: true
      algorithm: "AES256"

    access_control:
      - role: "data_provider"
        permissions: ["read", "write"]
      - role: "data_consumer"
        permissions: ["read"]
      - role: "data_steward"
        permissions: ["read", "write", "admin"]

    data_masking:
      - field: "ip_address"
        rule: "partial_mask"
        pattern: "xxx.xxx.xxx.*"

  # 监控和告警
  monitoring:
    metrics:
      - name: "data_quality_score"
        type: "gauge"
        threshold: 0.95  # 数据质量分数阈值
        alert_when: "below"

      - name: "data_freshness_delay"
        type: "histogram"
        threshold: "300s"  # 数据延迟阈值
        alert_when: "above"

      - name: "schema_validation_errors"
        type: "counter"
        threshold: 100  # 模式验证错误阈值
        alert_when: "above"

    alerts:
      - condition: "data_quality_score < 0.95"
        severity: "warning"
        message: "数据质量分数低于阈值"
        channels: ["email", "slack"]

      - condition: "data_freshness_delay > 300"
        severity: "error"
        message: "数据延迟超过5分钟"
        channels: ["email", "slack", "pagerduty"]

  # 测试场景
  test_scenarios:
    # 功能测试
    functional_tests:
      - name: "schema_validation"
        description: "验证数据模式合规性"
        input: "sample_event.json"
        expected_output: "validation_passed"

      - name: "data_quality_check"
        description: "检查数据质量规则"
        input: "test_dataset.csv"
        expected_output: "quality_score > 0.95"

    # 性能测试
    performance_tests:
      - name: "throughput_test"
        description: "测试数据处理吞吐量"
        load: "1000 events/second"
        duration: "1 hour"
        expected_throughput: "> 900 events/second"

      - name: "latency_test"
        description: "测试端到端延迟"
        percentile: "p95"
        expected_latency: "< 200ms"

    # 压力测试
    stress_tests:
      - name: "volume_spike_test"
        description: "测试数据量激增场景"
        spike_multiplier: 10
        duration: "30 minutes"
        expected_behavior: "graceful_degradation"

  # 版本控制
  versioning:
    strategy: "semantic_versioning"
    backward_compatibility: true
    deprecation_policy:
      notice_period: "6 months"
      migration_support: true

  # 文档和支持
  documentation:
    api_docs: "https://api.company.com/data-contracts/user-behavior"
    data_dictionary: "https://docs.company.com/data-dictionary/user-events"
    support_contacts:
      - name: "Data Engineering Team"
        email: "data-eng@company.com"
        slack: "#data-engineering"
      - name: "Data Quality Team"
        email: "data-quality@company.com"
        slack: "#data-quality"