# 人才能力评估模板

## 概述

本模板用于系统性评估大数据测试人才的能力水平，为职业发展和培训提供依据。

## 评估维度

### 1. 技术能力 (权重: 40%)
- **技术栈掌握度** (25%): 核心技术栈的深度和广度
  - 5分: 精通3+技术栈，具备架构设计能力
  - 4分: 熟练掌握2-3技术栈，能独立开发
  - 3分: 掌握1-2技术栈，基本应用熟练
  - 2分: 了解基础技术栈，需要指导使用
  - 1分: 技术基础薄弱，依赖他人支持

- **问题解决能力** (25%): 分析和解决复杂技术问题的能力
  - 5分: 能独立分析和解决系统级复杂问题
  - 4分: 能解决模块级复杂问题，具备调试技巧
  - 3分: 能解决一般性问题，逻辑思维清晰
  - 2分: 需要指导解决中等复杂度问题
  - 1分: 问题分析能力不足，依赖他人

- **创新应用能力** (25%): 将新技术应用到实际场景的能力
  - 5分: 主动引入新技术，创造性解决问题
  - 4分: 能快速学习应用新技术
  - 3分: 能跟进行业新技术发展趋势
  - 2分: 对新技术有基本了解
  - 1分: 对新技术不敏感，保守应用

- **技术学习能力** (25%): 自主学习和知识更新的能力
  - 5分: 持续学习，知识体系完善
  - 4分: 主动学习，能快速掌握新知识
  - 3分: 有学习意识，知识更新及时
  - 2分: 被动学习，需要推动
  - 1分: 学习动力不足，知识陈旧

### 2. 业务能力 (权重: 30%)
- **业务理解深度** (30%): 对业务领域的理解程度
  - 5分: 深入理解业务逻辑，能优化业务流程
  - 4分: 全面掌握业务知识，能独立分析需求
  - 3分: 基本理解业务需求，能参与业务讨论
  - 2分: 了解基本业务概念，需要业务指导
  - 1分: 业务知识薄弱，难以理解需求

- **价值创造能力** (30%): 为业务创造价值的程度
  - 5分: 能显著提升业务效率和质量
  - 4分: 能有效改善业务流程和体验
  - 3分: 能完成业务需求，保证基本质量
  - 2分: 能满足基本业务需求
  - 1分: 难以满足业务需求标准

- **沟通协作能力** (20%): 与业务团队协作的能力
  - 5分: 能有效 bridging 技术与业务
  - 4分: 沟通顺畅，能推动跨部门协作
  - 3分: 基本沟通能力正常
  - 2分: 沟通存在障碍，需要改进
  - 1分: 沟通能力差，影响协作

- **客户导向思维** (20%): 以客户为中心的服务意识
  - 5分: 高度关注用户体验，主动改进
  - 4分: 重视用户反馈，能快速响应
  - 3分: 基本关注用户需求
  - 2分: 对用户需求关注不足
  - 1分: 缺乏用户意识

### 3. 软技能 (权重: 20%)
- **学习成长能力** (30%): 持续学习和自我提升能力
- **沟通表达能力** (25%): 信息传递和表达能力
- **团队协作能力** (25%): 与他人合作共事能力
- **抗压韧性能力** (20%): 应对压力和挫折的能力

### 4. 成果贡献 (权重: 10%)
- **项目交付质量** (40%): 项目成果的质量水平
- **团队贡献度** (30%): 对团队发展的贡献
- **知识传承能力** (30%): 经验分享和人才培养

## 评估流程

### 1. 自我评估
- 员工根据评估标准进行自我评分
- 填写评估表，准备佐证材料

### 2. 主管评估
- 主管基于工作表现进行评分
- 结合具体工作成果和表现

### 3. 交叉评估
- 同事/合作伙伴提供反馈
- 多维度收集评估信息

### 4. 评估面谈
- 评估结果反馈和沟通
- 制定改进和发展计划

## 发展建议生成

### 根据评估结果自动生成：
- **优势强化**：突出个人优势领域
- **短板补齐**：针对薄弱环节的改进建议
- **发展路径**：职业发展的具体路径规划
- **培训推荐**：个性化培训和发展建议

