# examples/17_tools/maintenance_playbook.yml
---
- name: Big Data Testing Tools Maintenance Playbook
  hosts: testing_servers
  become: yes
  vars:
    maintenance_window: "02:00-04:00"
    backup_retention_days: 30
    log_retention_days: 90

  pre_tasks:
    - name: Check maintenance window
      assert:
        that: ansible_date_time.hour|int >= 2 and ansible_date_time.hour|int <= 4
        fail_msg: "Maintenance must be performed during maintenance window {{ maintenance_window }}"
      when: enforce_maintenance_window | default(true)

    - name: Create maintenance flag
      file:
        path: /tmp/maintenance_mode
        state: touch

    - name: Notify monitoring system
      uri:
        url: "{{ monitoring_webhook_url }}"
        method: POST
        body:
          message: "Starting maintenance on {{ inventory_hostname }}"
          status: "maintenance"
        body_format: json
      when: monitoring_webhook_url is defined

  roles:
    - role: maintenance_common
      vars:
        maintenance_type: "{{ maintenance_type | default('routine') }}"

    - role: backup_validation
      when: maintenance_type in ['routine', 'backup']

    - role: security_updates
      when: maintenance_type in ['routine', 'security']

    - role: performance_optimization
      when: maintenance_type in ['routine', 'performance']

    - role: log_rotation
      when: maintenance_type in ['routine', 'cleanup']

  post_tasks:
    - name: Remove maintenance flag
      file:
        path: /tmp/maintenance_mode
        state: absent

    - name: Verify system health
      include_role:
        name: health_check

    - name: Notify completion
      uri:
        url: "{{ monitoring_webhook_url }}"
        method: POST
        body:
          message: "Maintenance completed on {{ inventory_hostname }}"
          status: "normal"
        body_format: json
      when: monitoring_webhook_url is defined

- name: Version Upgrade Maintenance
  hosts: testing_servers
  become: yes
  vars:
    target_versions:
      great_expectations: "0.16.0"
      airflow: "2.5.0"
      prometheus: "2.40.0"

  tasks:
    - name: Backup current configurations
      include_role:
        name: config_backup

    - name: Stop services before upgrade
      service:
        name: "{{ item }}"
        state: stopped
      loop:
        - great_expectations
        - airflow-scheduler
        - airflow-webserver
        - prometheus

    - name: Upgrade Great Expectations
      pip:
        name: great_expectations
        version: "{{ target_versions.great_expectations }}"
        state: present

    - name: Upgrade Airflow
      pip:
        name: apache-airflow
        version: "{{ target_versions.airflow }}"
        extra_args: --constraint https://raw.githubusercontent.com/apache/airflow/constraints-{{ target_versions.airflow }}/constraints-{{ python_version }}.txt
        state: present

    - name: Upgrade Prometheus
      include_role:
        name: prometheus_upgrade
        vars:
          version: "{{ target_versions.prometheus }}"

    - name: Run configuration migration
      command: great_expectations --version
      register: ge_version_check

    - name: Validate upgrades
      assert:
        that:
          - "'{{ target_versions.great_expectations }}' in ge_version_check.stdout"
        fail_msg: "Version validation failed"

    - name: Start services after upgrade
      service:
        name: "{{ item }}"
        state: started
      loop:
        - prometheus
        - airflow-webserver
        - airflow-scheduler
        - great_expectations

    - name: Run post-upgrade tests
      include_role:
        name: upgrade_validation

- name: Emergency Maintenance Response
  hosts: testing_servers
  become: yes
  vars:
    emergency_mode: true

  tasks:
    - name: Assess system status
      include_role:
        name: system_diagnosis

    - name: Isolate affected components
      service:
        name: "{{ failed_service }}"
        state: stopped
      when: failed_service is defined

    - name: Collect diagnostic information
      include_role:
        name: diagnostic_collection

    - name: Apply emergency fixes
      include_role:
        name: emergency_fixes

    - name: Restore services
      service:
        name: "{{ item }}"
        state: started
      loop: "{{ affected_services | default([]) }}"

    - name: Validate recovery
      include_role:
        name: recovery_validation

    - name: Document incident
      include_role:
        name: incident_documentation

# Maintenance role definitions
- name: Common Maintenance Tasks
  hosts: testing_servers
  become: yes
  tasks:
    - name: Update package cache
      apt:
        update_cache: yes
      when: ansible_os_family == "Debian"

    - name: Install security updates
      package:
        name: "*"
        state: latest
      when: maintenance_type == "security"

    - name: Clean package cache
      command: apt-get autoclean
      when: ansible_os_family == "Debian"

    - name: Remove unused packages
      command: apt-get autoremove
      when: ansible_os_family == "Debian"

- name: Backup Validation Tasks
  hosts: testing_servers
  become: yes
  tasks:
    - name: List backup files
      find:
        paths: "/backup"
        patterns: "*.tar.gz"
        age: "7d"
      register: recent_backups

    - name: Validate backup integrity
      command: "tar -tzf {{ item.path }}"
      loop: "{{ recent_backups.files }}"
      register: backup_validation
      failed_when: backup_validation.rc != 0

    - name: Report backup status
      debug:
        msg: "Found {{ recent_backups.files | length }} recent backups, all validated successfully"

- name: Performance Optimization Tasks
  hosts: testing_servers
  become: yes
  tasks:
    - name: Analyze disk usage
      command: df -h
      register: disk_usage

    - name: Check memory usage
      command: free -h
      register: memory_usage

    - name: Optimize database connections
      lineinfile:
        path: /etc/postgresql/postgresql.conf
        regexp: '^max_connections'
        line: "max_connections = 100"
      notify: restart postgresql

    - name: Tune JVM settings
      lineinfile:
        path: /opt/jmeter/bin/jmeter
        regexp: '^HEAP='
        line: "HEAP=\"-Xms512m -Xmx2048m\""
      when: "'jmeter' in group_names"

  handlers:
    - name: restart postgresql
      service:
        name: postgresql
        state: restarted

- name: Log Rotation Tasks
  hosts: testing_servers
  become: yes
  vars:
    log_dirs:
      - "/var/log/testing_tools"
      - "/opt/airflow/logs"
      - "/var/log/prometheus"

  tasks:
    - name: Find old log files
      find:
        paths: "{{ log_dirs }}"
        patterns: "*.log"
        age: "{{ log_retention_days }}d"
      register: old_logs

    - name: Compress old logs
      archive:
        path: "{{ item.path }}"
        dest: "{{ item.path }}.gz"
        remove: yes
      loop: "{{ old_logs.files }}"
      when: old_logs.files | length > 0

    - name: Remove very old compressed logs
      find:
        paths: "{{ log_dirs }}"
        patterns: "*.log.gz"
        age: "365d"
      register: very_old_logs

    - name: Delete very old logs
      file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ very_old_logs.files }}"
      when: very_old_logs.files | length > 0

    - name: Report cleanup results
      debug:
        msg: "Cleaned up {{ old_logs.files | length }} old log files"

# Health check role
- name: System Health Check
  hosts: testing_servers
  become: yes
  tasks:
    - name: Check service status
      service:
        name: "{{ item }}"
        state: started
      loop:
        - prometheus
        - grafana
        - airflow-webserver
      register: service_status

    - name: Validate API endpoints
      uri:
        url: "{{ item.url }}"
        method: GET
        status_code: 200
      loop:
        - { url: "http://localhost:9090/-/healthy" }
        - { url: "http://localhost:3000/api/health" }
        - { url: "http://localhost:8080/health" }
      register: api_checks

    - name: Report health status
      debug:
        msg: |
          System Health Check Results:
          Services: {{ service_status.results | map(attribute='changed') | list | count(true) }} running
          APIs: {{ api_checks.results | map(attribute='status') | select('equalto', 200) | list | length }} healthy