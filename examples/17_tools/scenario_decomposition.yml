## 分解工具与自动化

### 分解分析器

```python
import yaml
import networkx as nx
from typing import Dict, List, Any
import matplotlib.pyplot as plt

class ScenarioDecompositionAnalyzer:
    """场景分解分析器"""

    def __init__(self, decomposition_config: Dict[str, Any]):
        self.config = decomposition_config
        self.dependency_graph = nx.DiGraph()
        self._build_dependency_graph()

    def _build_dependency_graph(self):
        """构建依赖关系图"""
        # 添加场景节点
        for level, scenarios in self.config.get('scenario_hierarchy', {}).items():
            for scenario in scenarios:
                self.dependency_graph.add_node(
                    scenario['id'],
                    **scenario
                )

        # 添加依赖关系边
        for level, scenarios in self.config.get('scenario_hierarchy', {}).items():
            for scenario in scenarios:
                dependencies = scenario.get('dependencies', [])
                for dep in dependencies:
                    self.dependency_graph.add_edge(dep, scenario['id'])

    def get_execution_order(self) -> List[str]:
        """获取执行顺序"""
        try:
            # 拓扑排序获取执行顺序
            execution_order = list(nx.topological_sort(self.dependency_graph))
            return execution_order
        except nx.NetworkXError:
            # 如果存在循环依赖，返回优先级排序
            return self._get_priority_based_order()

    def _get_priority_based_order(self) -> List[str]:
        """基于优先级的排序"""
        priority_map = {'critical': 4, 'high': 3, 'medium': 2, 'low': 1}

        scenarios = []
        for level, scenario_list in self.config.get('scenario_hierarchy', {}).items():
            scenarios.extend(scenario_list)

        # 按优先级和复杂度排序
        sorted_scenarios = sorted(
            scenarios,
            key=lambda x: (
                priority_map.get(x.get('priority', 'low'), 1),
                x.get('complexity', 'low') == 'high' and 1 or 0
            ),
            reverse=True
        )

        return [s['id'] for s in sorted_scenarios]

    def identify_critical_path(self) -> List[str]:
        """识别关键路径"""
        # 计算每个节点的权重（基于优先级和复杂度）
        node_weights = {}
        for node, data in self.dependency_graph.nodes(data=True):
            priority_weight = {'critical': 4, 'high': 3, 'medium': 2, 'low': 1}
            complexity_weight = {'critical': 3, 'high': 2, 'medium': 1, 'low': 0}
            weight = (priority_weight.get(data.get('priority'), 1) +
                     complexity_weight.get(data.get('complexity'), 0))
            node_weights[node] = weight

        # 找到权重最大的路径
        all_paths = []
        for source in self._get_source_nodes():
            for target in self._get_sink_nodes():
                try:
                    paths = list(nx.all_simple_paths(self.dependency_graph, source, target))
                    for path in paths:
                        path_weight = sum(node_weights.get(node, 1) for node in path)
                        all_paths.append((path, path_weight))
                except nx.NetworkXNoPath:
                    continue

        if all_paths:
            critical_path, _ = max(all_paths, key=lambda x: x[1])
            return critical_path

        return []

    def _get_source_nodes(self) -> List[str]:
        """获取源节点（没有入边的节点）"""
        return [node for node in self.dependency_graph.nodes()
                if self.dependency_graph.in_degree(node) == 0]

    def _get_sink_nodes(self) -> List[str]:
        """获取汇节点（没有出边的节点）"""
        return [node for node in self.dependency_graph.nodes()
                if self.dependency_graph.out_degree(node) == 0]

    def calculate_test_effort(self) -> Dict[str, Any]:
        """计算测试工作量"""
        effort_breakdown = {
            'total_scenarios': 0,
            'total_effort_days': 0,
            'effort_by_priority': {},
            'effort_by_category': {}
        }

        for level, scenarios in self.config.get('scenario_hierarchy', {}).items():
            for scenario in scenarios:
                effort_breakdown['total_scenarios'] += 1

                # 估算工作量（天）
                effort_days = self._estimate_effort(scenario)
                effort_breakdown['total_effort_days'] += effort_days

                # 按优先级统计
                priority = scenario.get('priority', 'medium')
                effort_breakdown['effort_by_priority'][priority] = \
                    effort_breakdown['effort_by_priority'].get(priority, 0) + effort_days

                # 按测试类型统计
                test_types = scenario.get('test_types', [])
                for test_type in test_types:
                    effort_breakdown['effort_by_category'][test_type] = \
                        effort_breakdown['effort_by_category'].get(test_type, 0) + effort_days

        return effort_breakdown

    def _estimate_effort(self, scenario: Dict[str, Any]) -> float:
        """估算单个场景的工作量"""
        # 基于复杂度、优先级和测试类型估算
        base_effort = 1.0  # 基础工作量1天

        # 复杂度乘数
        complexity_multiplier = {
            'low': 0.5,
            'medium': 1.0,
            'high': 2.0,
            'critical': 3.0
        }.get(scenario.get('complexity', 'medium'), 1.0)

        # 优先级乘数（高优先级需要更多准备）
        priority_multiplier = {
            'low': 0.8,
            'medium': 1.0,
            'high': 1.2,
            'critical': 1.5
        }.get(scenario.get('priority', 'medium'), 1.0)

        # 测试类型乘数
        test_type_multiplier = len(scenario.get('test_types', [])) * 0.5 + 0.5

        return base_effort * complexity_multiplier * priority_multiplier * test_type_multiplier

    def generate_coverage_matrix(self) -> Dict[str, Any]:
        """生成覆盖矩阵"""
        coverage_matrix = {
            'requirements_coverage': {},
            'risk_coverage': {},
            'technical_coverage': {}
        }

        # 需求覆盖分析
        requirements = self.config.get('scenario_overview', {}).get('business_description', '').split('，')
        for req in requirements:
            if req.strip():
                coverage_matrix['requirements_coverage'][req.strip()] = []

        # 为每个场景分配覆盖的需求
        for level, scenarios in self.config.get('scenario_hierarchy', {}).items():
            for scenario in scenarios:
                scenario_id = scenario['id']
                # 简化的需求映射逻辑（实际需要更复杂的匹配）
                for req in coverage_matrix['requirements_coverage']:
                    if any(keyword in scenario.get('description', '') for keyword in req.split()):
                        coverage_matrix['requirements_coverage'][req].append(scenario_id)

        return coverage_matrix

    def visualize_decomposition(self, output_file: str = None):
        """可视化分解结构"""
        plt.figure(figsize=(12, 8))

        # 计算节点位置
        pos = nx.spring_layout(self.dependency_graph, k=2, iterations=50)

        # 绘制节点
        node_colors = []
        for node in self.dependency_graph.nodes():
            node_data = self.dependency_graph.nodes[node]
            priority = node_data.get('priority', 'medium')
            color_map = {'critical': 'red', 'high': 'orange', 'medium': 'yellow', 'low': 'green'}
            node_colors.append(color_map.get(priority, 'blue'))

        nx.draw_networkx_nodes(self.dependency_graph, pos,
                             node_color=node_colors,
                             node_size=800, alpha=0.8)

        # 绘制边
        nx.draw_networkx_edges(self.dependency_graph, pos,
                             edge_color='gray', arrows=True, arrowsize=20)

        # 添加标签
        labels = {node: f"{node}\n{self.dependency_graph.nodes[node].get('name', '')[:10]}..."
                for node in self.dependency_graph.nodes()}
        nx.draw_networkx_labels(self.dependency_graph, pos, labels, font_size=8)

        plt.title('测试场景分解图', fontsize=16)
        plt.axis('off')
        plt.tight_layout()

        if output_file:
            plt.savefig(output_file, dpi=300, bbox_inches='tight')
        else:
            plt.show()

        return plt.gcf()

    def export_decomposition_report(self, output_file: str):
        """导出分解报告"""
        report = {
            'metadata': self.config.get('metadata', {}),
            'execution_order': self.get_execution_order(),
            'critical_path': self.identify_critical_path(),
            'effort_analysis': self.calculate_test_effort(),
            'coverage_analysis': self.generate_coverage_matrix(),
            'dependency_graph': nx.to_dict_of_dicts(self.dependency_graph)
        }

        with open(output_file, 'w', encoding='utf-8') as f:
            yaml.dump(report, f, default_flow_style=False, allow_unicode=True,
                     sort_keys=False, indent=2)
```

### 分解配置验证器

```python
class DecompositionValidator:
    """分解配置验证器"""

    def __init__(self, schema_file: str = 'decomposition_schema.yml'):
        with open(schema_file, 'r', encoding='utf-8') as f:
            self.schema = yaml.safe_load(f)

    def validate_decomposition(self, decomposition: Dict[str, Any]) -> List[str]:
        """验证分解配置"""
        errors = []

        # 必需字段检查
        required_fields = [
            'metadata.id', 'metadata.title', 'scenario_hierarchy',
            'decomposition_strategy', 'scenario_overview'
        ]

        def check_required_fields(obj: Dict, path: str, fields: List[str]):
            for field in fields:
                field_path = f"{path}.{field}" if path else field
                keys = field.split('.')
                current = obj
                try:
                    for key in keys:
                        current = current[key]
                except (KeyError, TypeError):
                    errors.append(f"Missing required field: {field_path}")

        check_required_fields(decomposition, '', required_fields)

        # 依赖关系验证
        errors.extend(self._validate_dependencies(decomposition))

        # 优先级一致性验证
        errors.extend(self._validate_priorities(decomposition))

        # 覆盖率验证
        errors.extend(self._validate_coverage(decomposition))

        return errors

    def _validate_dependencies(self, decomposition: Dict[str, Any]) -> List[str]:
        """验证依赖关系"""
        errors = []
        all_scenario_ids = set()

        # 收集所有场景ID
        for level, scenarios in decomposition.get('scenario_hierarchy', {}).items():
            for scenario in scenarios:
                all_scenario_ids.add(scenario['id'])

        # 验证依赖关系
        for level, scenarios in decomposition.get('scenario_hierarchy', {}).items():
            for scenario in scenarios:
                dependencies = scenario.get('dependencies', [])
                for dep in dependencies:
                    if dep not in all_scenario_ids:
                        errors.append(f"Scenario {scenario['id']} has invalid dependency: {dep}")

        return errors

    def _validate_priorities(self, decomposition: Dict[str, Any]) -> List[str]:
        """验证优先级一致性"""
        errors = []
        valid_priorities = {'critical', 'high', 'medium', 'low'}

        for level, scenarios in decomposition.get('scenario_hierarchy', {}).items():
            for scenario in scenarios:
                priority = scenario.get('priority')
                if priority and priority not in valid_priorities:
                    errors.append(f"Invalid priority '{priority}' for scenario {scenario['id']}")

                # 子场景优先级不应高于父场景
                parent_id = scenario.get('parent_scenario')
                if parent_id:
                    parent_priority = None
                    for level_scenarios in decomposition.get('scenario_hierarchy', {}).values():
                        for s in level_scenarios:
                            if s['id'] == parent_id:
                                parent_priority = s.get('priority')
                                break
                        if parent_priority:
                            break

                    if parent_priority and priority:
                        priority_levels = {'low': 1, 'medium': 2, 'high': 3, 'critical': 4}
                        if priority_levels.get(priority, 0) > priority_levels.get(parent_priority, 0):
                            errors.append(f"Scenario {scenario['id']} has higher priority than parent {parent_id}")

        return errors

    def _validate_coverage(self, decomposition: Dict[str, Any]) -> List[str]:
        """验证覆盖率"""
        errors = []

        coverage_target = decomposition.get('decomposition_strategy', {}).get('coverage_target', 80)

        # 计算实际覆盖率（简化的计算）
        total_scenarios = 0
        covered_scenarios = 0

        for level, scenarios in decomposition.get('scenario_hierarchy', {}).items():
            total_scenarios += len(scenarios)
            # 假设有测试类型的场景算作已覆盖
            covered_scenarios += len([s for s in scenarios if s.get('test_types')])

        if total_scenarios > 0:
            actual_coverage = (covered_scenarios / total_scenarios) * 100
            if actual_coverage < coverage_target:
                errors.append(f"Coverage {actual_coverage:.1f}% below target {coverage_target}%")

        return errors
```

## 最佳实践

1. **分层分解**: 采用分层分解策略，从端到端场景逐步分解到组件级别
2. **依赖管理**: 明确场景间的依赖关系，确保正确的执行顺序
3. **优先级排序**: 基于风险和业务价值确定测试优先级
4. **覆盖分析**: 确保分解后的场景能够充分覆盖业务需求和技术风险
5. **自动化生成**: 利用工具自动生成测试用例和执行脚本
6. **持续优化**: 根据测试结果和反馈持续优化分解策略
7. **文档化**: 详细记录分解过程和决策依据
8. **团队协作**: 涉及多方 stakeholders 共同参与分解过程

这个分解模板体系提供了系统化的大数据测试场景分析和规划方法，确保测试活动的全面性和有效性。