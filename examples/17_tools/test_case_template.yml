### 模板实例化

```python
import yaml
from pathlib import Path
from typing import Dict, Any

class TestCaseGenerator:
    """测试用例生成器"""

    def __init__(self, template_dir: str):
        self.template_dir = Path(template_dir)
        self.templates = {}

    def load_template(self, template_name: str) -> Dict[str, Any]:
        """加载模板"""
        template_path = self.template_dir / f"{template_name}.yml"
        with open(template_path, 'r', encoding='utf-8') as f:
            template = yaml.safe_load(f)
        return template

    def instantiate_template(self, template: Dict[str, Any],
                           customizations: Dict[str, Any]) -> Dict[str, Any]:
        """实例化模板"""
        # 深拷贝模板
        instance = json.loads(json.dumps(template))

        # 应用自定义配置
        self._apply_customizations(instance, customizations)

        # 生成唯一ID
        instance['metadata']['id'] = self._generate_unique_id(instance)

        # 更新时间戳
        instance['metadata']['created_date'] = datetime.now().isoformat()
        instance['metadata']['version'] = "1.0"

        return instance

    def _apply_customizations(self, instance: Dict[str, Any],
                            customizations: Dict[str, Any]):
        """应用自定义配置"""
        def deep_update(base: Dict[str, Any], update: Dict[str, Any]):
            for key, value in update.items():
                if isinstance(value, dict) and key in base and isinstance(base[key], dict):
                    deep_update(base[key], value)
                else:
                    base[key] = value

        deep_update(instance, customizations)

    def _generate_unique_id(self, instance: Dict[str, Any]) -> str:
        """生成唯一ID"""
        category = instance['metadata']['category']
        timestamp = datetime.now().strftime("%Y%m%d%H%M%S")
        return f"TC-{category.upper()}-{timestamp}"

    def validate_instance(self, instance: Dict[str, Any]) -> List[str]:
        """验证实例"""
        errors = []

        # 必需字段检查
        required_fields = [
            'metadata.id', 'metadata.title', 'metadata.category',
            'test_objective', 'preconditions', 'test_steps', 'expected_results'
        ]

        def check_required(obj: Dict, path: str, fields: List[str]):
            for field in fields:
                field_path = f"{path}.{field}" if path else field
                keys = field.split('.')
                current = obj
                for key in keys:
                    if key not in current:
                        errors.append(f"Missing required field: {field_path}")
                        break
                    current = current[key]

        check_required(instance, '', required_fields)

        # 逻辑一致性检查
        if instance.get('metadata', {}).get('priority') == 'critical':
            if not instance.get('risk_assessment'):
                errors.append("Critical priority test cases must have risk assessment")

        return errors

    def export_instance(self, instance: Dict[str, Any], output_path: str):
        """导出实例"""
        with open(output_path, 'w', encoding='utf-8') as f:
            yaml.dump(instance, f, default_flow_style=False, allow_unicode=True,
                     sort_keys=False, indent=2)
```

### 模板库管理

```python
import sqlite3
from pathlib import Path

class TemplateRepository:
    """模板库管理"""

    def __init__(self, db_path: str = 'template_repository.db'):
        self.db_path = db_path
        self._init_database()

    def _init_database(self):
        """初始化数据库"""
        with sqlite3.connect(self.db_path) as conn:
            conn.execute('''
                CREATE TABLE IF NOT EXISTS templates (
                    id INTEGER PRIMARY KEY AUTOINCREMENT,
                    name TEXT UNIQUE NOT NULL,
                    category TEXT NOT NULL,
                    version TEXT NOT NULL,
                    description TEXT,
                    content TEXT NOT NULL,
                    author TEXT,
                    created_date TEXT,
                    updated_date TEXT,
                    usage_count INTEGER DEFAULT 0
                )
            ''')

            conn.execute('''
                CREATE TABLE IF NOT EXISTS template_tags (
                    template_id INTEGER,
                    tag TEXT,
                    FOREIGN KEY (template_id) REFERENCES templates(id)
                )
            ''')

    def add_template(self, name: str, category: str, content: Dict[str, Any],
                    description: str = "", author: str = ""):
        """添加模板"""
        content_str = yaml.dump(content, default_flow_style=False, allow_unicode=True)

        with sqlite3.connect(self.db_path) as conn:
            cursor = conn.execute('''
                INSERT INTO templates (name, category, version, description, content, author, created_date, updated_date)
                VALUES (?, ?, ?, ?, ?, ?, ?, ?)
            ''', (name, category, content.get('metadata', {}).get('version', '1.0'),
                  description, content_str, author,
                  datetime.now().isoformat(), datetime.now().isoformat()))

            template_id = cursor.lastrowid

            # 添加标签
            tags = content.get('metadata', {}).get('tags', [])
            for tag in tags:
                conn.execute('INSERT INTO template_tags (template_id, tag) VALUES (?, ?)',
                           (template_id, tag))

    def get_template(self, name: str) -> Dict[str, Any]:
        """获取模板"""
        with sqlite3.connect(self.db_path) as conn:
            cursor = conn.execute('''
                SELECT content FROM templates WHERE name = ?
            ''', (name,))

            row = cursor.fetchone()
            if row:
                content_str = row[0]
                content = yaml.safe_load(content_str)

                # 增加使用计数
                conn.execute('UPDATE templates SET usage_count = usage_count + 1 WHERE name = ?',
                           (name,))

                return content

        return None

    def search_templates(self, category: str = None, tags: List[str] = None) -> List[Dict[str, Any]]:
        """搜索模板"""
        with sqlite3.connect(self.db_path) as conn:
            query = '''
                SELECT t.*, GROUP_CONCAT(tt.tag) as tags
                FROM templates t
                LEFT JOIN template_tags tt ON t.id = tt.template_id
                WHERE 1=1
            '''
            params = []

            if category:
                query += ' AND t.category = ?'
                params.append(category)

            if tags:
                tag_conditions = ' OR '.join(['tt.tag = ?'] * len(tags))
                query += f' AND ({tag_conditions})'
                params.extend(tags)

            query += ' GROUP BY t.id ORDER BY t.usage_count DESC'

            cursor = conn.execute(query, params)

            results = []
            for row in cursor.fetchall():
                template_info = {
                    'id': row[0],
                    'name': row[1],
                    'category': row[2],
                    'version': row[3],
                    'description': row[4],
                    'author': row[6],
                    'created_date': row[7],
                    'updated_date': row[8],
                    'usage_count': row[9],
                    'tags': row[10].split(',') if row[10] else []
                }
                results.append(template_info)

            return results

    def update_template(self, name: str, content: Dict[str, Any]):
        """更新模板"""
        content_str = yaml.dump(content, default_flow_style=False, allow_unicode=True)

        with sqlite3.connect(self.db_path) as conn:
            conn.execute('''
                UPDATE templates
                SET content = ?, version = ?, updated_date = ?
                WHERE name = ?
            ''', (content_str, content.get('metadata', {}).get('version', '1.0'),
                  datetime.now().isoformat(), name))

            # 更新标签
            template_id = conn.execute('SELECT id FROM templates WHERE name = ?',
                                     (name,)).fetchone()[0]

            conn.execute('DELETE FROM template_tags WHERE template_id = ?', (template_id,))

            tags = content.get('metadata', {}).get('tags', [])
            for tag in tags:
                conn.execute('INSERT INTO template_tags (template_id, tag) VALUES (?, ?)',
                           (template_id, tag))
```

## 最佳实践

1. **标准化**: 使用统一的模板结构，确保测试用例的一致性和可维护性
2. **模块化**: 将复杂测试用例分解为可重用的模块和组件
3. **参数化**: 使用参数化配置，使模板适用于不同场景
4. **版本控制**: 对模板进行版本管理，跟踪变更历史
5. **评审机制**: 建立模板评审机制，确保质量和一致性
6. **自动化生成**: 利用工具自动生成测试用例实例
7. **持续更新**: 根据项目经验和最佳实践持续优化模板
8. **培训普及**: 对团队成员进行模板使用培训

这个模板体系提供了灵活、可扩展的测试用例设计框架，支持各种大数据测试场景的需求。