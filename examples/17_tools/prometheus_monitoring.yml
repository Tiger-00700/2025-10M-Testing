# examples/17_tools/prometheus_monitoring.yml
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alert_rules.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
          # - alertmanager:9093

scrape_configs:
  # The job name is added as a label `job=<job_name>` to any timeseries scraped from this config.
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Node Exporter for system metrics
  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']

  # Airflow metrics
  - job_name: 'airflow'
    static_configs:
      - targets: ['airflow-webserver:8793']
    metrics_path: '/admin/metrics'
    scrape_interval: 30s

  # JMeter metrics (if available)
  - job_name: 'jmeter'
    static_configs:
      - targets: ['jmeter:9270']
    scrape_interval: 30s

  # Spark metrics
  - job_name: 'spark'
    static_configs:
      - targets: ['spark-master:4040']
    metrics_path: '/metrics/json'
    scrape_interval: 30s

  # Custom application metrics
  - job_name: 'testing-tools'
    static_configs:
      - targets: ['great-expectations:8000']
    scrape_interval: 30s

  # Data quality metrics
  - job_name: 'data-quality'
    static_configs:
      - targets: ['data-quality-service:8080']
    metrics_path: '/metrics'
    scrape_interval: 60s

  # Performance test metrics
  - job_name: 'performance-tests'
    static_configs:
      - targets: ['locust-master:8089']
    metrics_path: '/metrics'
    scrape_interval: 30s