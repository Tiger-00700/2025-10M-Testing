# examples/17_tools/ansible_toolchain_setup.yml
---
- name: Setup Big Data Testing Toolchain
  hosts: test_servers
  become: yes
  vars:
    jmeter_version: "5.6.2"
    spark_version: "3.4.1"
    airflow_version: "2.7.0"
    prometheus_version: "2.45.0"
    grafana_version: "10.1.0"

  tasks:
    - name: Update system packages
      apt:
        update_cache: yes
        cache_valid_time: 3600
      when: ansible_os_family == "Debian"

    - name: Install Java
      apt:
        name: openjdk-11-jdk
        state: present

    - name: Install Python and pip
      apt:
        name:
          - python3
          - python3-pip
          - python3-venv
        state: present

    - name: Install system dependencies
      apt:
        name:
          - curl
          - wget
          - unzip
          - git
          - docker.io
          - docker-compose
        state: present

    - name: Create tool directories
      file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - /opt/tools
        - /opt/jmeter
        - /opt/spark
        - /opt/airflow
        - /opt/prometheus
        - /opt/grafana
        - /data/input
        - /data/output
        - /data/results

    - name: Download and install JMeter
      unarchive:
        src: "https://downloads.apache.org/jmeter/binaries/apache-jmeter-{{ jmeter_version }}.tgz"
        dest: /opt
        remote_src: yes
        creates: "/opt/apache-jmeter-{{ jmeter_version }}"

    - name: Create JMeter symlink
      file:
        src: "/opt/apache-jmeter-{{ jmeter_version }}"
        dest: /opt/jmeter
        state: link

    - name: Download and install Spark
      unarchive:
        src: "https://downloads.apache.org/spark/spark-{{ spark_version }}/spark-{{ spark_version }}-bin-hadoop3.tgz"
        dest: /opt
        remote_src: yes
        creates: "/opt/spark-{{ spark_version }}-bin-hadoop3"

    - name: Create Spark symlink
      file:
        src: "/opt/spark-{{ spark_version }}-bin-hadoop3"
        dest: /opt/spark
        state: link

    - name: Install Airflow
      pip:
        name:
          - apache-airflow=={{ airflow_version }}
          - apache-airflow-providers-docker
          - apache-airflow-providers-amazon
        state: present

    - name: Initialize Airflow database
      command: airflow db init
      environment:
        AIRFLOW_HOME: /opt/airflow

    - name: Create Airflow admin user
      command: airflow users create --username admin --password admin --firstname Admin --lastname User --role Admin --email admin@example.com
      environment:
        AIRFLOW_HOME: /opt/airflow

    - name: Download and install Prometheus
      unarchive:
        src: "https://github.com/prometheus/prometheus/releases/download/v{{ prometheus_version }}/prometheus-{{ prometheus_version }}.linux-amd64.tar.gz"
        dest: /opt
        remote_src: yes
        creates: "/opt/prometheus-{{ prometheus_version }}.linux-amd64"

    - name: Create Prometheus symlink
      file:
        src: "/opt/prometheus-{{ prometheus_version }}.linux-amd64"
        dest: /opt/prometheus
        state: link

    - name: Download and install Grafana
      unarchive:
        src: "https://dl.grafana.com/oss/release/grafana-{{ grafana_version }}.linux-amd64.tar.gz"
        dest: /opt
        remote_src: yes
        creates: "/opt/grafana-{{ grafana_version }}"

    - name: Create Grafana symlink
      file:
        src: "/opt/grafana-{{ grafana_version }}"
        dest: /opt/grafana
        state: link

    - name: Install Python testing libraries
      pip:
        name:
          - great-expectations
          - pytest
          - locust
          - requests
          - pandas
          - pyspark
        state: present

    - name: Copy configuration files
      copy:
        src: "{{ item.src }}"
        dest: "{{ item.dest }}"
        mode: '0644'
      loop:
        - { src: 'prometheus.yml', dest: '/opt/prometheus/prometheus.yml' }
        - { src: 'grafana.ini', dest: '/opt/grafana/conf/grafana.ini' }
        - { src: 'airflow.cfg', dest: '/opt/airflow/airflow.cfg' }

    - name: Create systemd services
      template:
        src: "{{ item }}.service.j2"
        dest: "/etc/systemd/system/{{ item }}.service"
        mode: '0644'
      loop:
        - airflow-webserver
        - airflow-scheduler
        - prometheus
        - grafana

    - name: Enable and start services
      systemd:
        name: "{{ item }}"
        enabled: yes
        state: started
        daemon_reload: yes
      loop:
        - airflow-webserver
        - airflow-scheduler
        - prometheus
        - grafana

    - name: Create monitoring dashboards
      uri:
        url: "http://localhost:3000/api/dashboards/import"
        method: POST
        headers:
          Authorization: "Bearer {{ grafana_api_key }}"
          Content-Type: "application/json"
        body_format: json
        body: "{{ lookup('file', 'grafana_dashboard.json') }}"
      when: grafana_api_key is defined

    - name: Verify installations
      command: "{{ item.command }}"
      register: result
      failed_when: result.rc != 0
      loop:
        - { command: '/opt/jmeter/bin/jmeter --version' }
        - { command: '/opt/spark/bin/spark-submit --version' }
        - { command: 'airflow version' }
        - { command: '/opt/prometheus/prometheus --version' }
        - { command: '/opt/grafana/bin/grafana-server --version' }

    - name: Print installation summary
      debug:
        msg: |
          Big Data Testing Toolchain Setup Complete!

          Installed Tools:
          - JMeter: {{ jmeter_version }}
          - Spark: {{ spark_version }}
          - Airflow: {{ airflow_version }}
          - Prometheus: {{ prometheus_version }}
          - Grafana: {{ grafana_version }}

          Services Status:
          - Airflow Webserver: http://{{ ansible_default_ipv4.address }}:8080
          - Airflow Scheduler: Running
          - Prometheus: http://{{ ansible_default_ipv4.address }}:9090
          - Grafana: http://{{ ansible_default_ipv4.address }}:3000

          Next Steps:
          1. Configure tool-specific settings
          2. Set up data sources and connections
          3. Create and schedule test workflows
          4. Configure monitoring and alerting