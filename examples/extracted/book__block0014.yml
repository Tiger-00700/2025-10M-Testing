
     # Docker Compose配置示例 - 确保环境一致性
     version: '3'
     services:
       hadoop-master:
         image: hadoop:3.3.4
         container_name: hadoop-master
         hostname: hadoop-master
         environment:

           - JAVA_HOME=/usr/lib/jvm/java-8-openjdk-amd64

           - HADOOP_HOME=/opt/hadoop

         volumes:

           - ./hadoop-config:/opt/hadoop/etc/hadoop

           - ./data:/data

         ports:

           - "9870:9870"

           - "8088:8088"

         networks:

           - hadoop-network

         mem_limit: 8g

         cpus: 4

       hadoop-worker-1:
         image: hadoop:3.3.4
         container_name: hadoop-worker-1
         hostname: hadoop-worker-1
         environment:

           - JAVA_HOME=/usr/lib/jvm/java-8-openjdk-amd64

           - HADOOP_HOME=/opt/hadoop

         volumes:

           - ./hadoop-config:/opt/hadoop/etc/hadoop

           - ./worker1-data:/data

         networks:

           - hadoop-network

         mem_limit: 8g

         cpus: 4

     networks:
       hadoop-network:
         driver: bridge
