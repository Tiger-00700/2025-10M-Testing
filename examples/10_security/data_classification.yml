# examples/10_security/data_classification.yml
# 数据分类配置示例

data_classification:
  # 分类级别定义
  classification_levels:
    public:
      name: "公开数据"
      sensitivity: "low"
      access_requirements: "none"
      encryption_required: false
      retention_years: 3

    internal:
      name: "内部数据"
      sensitivity: "medium"
      access_requirements: "employee_credentials"
      encryption_required: false
      retention_years: 5

    confidential:
      name: "机密数据"
      sensitivity: "high"
      access_requirements: "role_based_access"
      encryption_required: true
      retention_years: 7

    restricted:
      name: "受限数据"
      sensitivity: "critical"
      access_requirements: "explicit_approval"
      encryption_required: true
      retention_years: 10

  # 数据分类规则
  classification_rules:
    # 基于内容的关键字
    content_based:
      pii_keywords:
        - "social_security_number"
        - "passport_number"
        - "drivers_license"
        - "bank_account"
        - "credit_card"
      classification: "restricted"

      health_keywords:
        - "medical_record"
        - "diagnosis"
        - "treatment"
        - "medication"
      classification: "confidential"

    # 基于数据类型的规则
    data_type_based:
      personal_identifiable:
        patterns:
          - "email_regex"
          - "phone_regex"
          - "address_regex"
        classification: "confidential"

      financial_data:
        patterns:
          - "salary"
          - "bank_details"
          - "payment_info"
        classification: "restricted"

  # 自动分类配置
  auto_classification:
    enabled: true
    scan_frequency: "daily"
    confidence_threshold: 0.8
    manual_review_required: "below_threshold"

  # 分类标签管理
  labeling:
    label_format: "classification:{level}"
    inheritance_rules:
      - "database > schema > table > column"
      - "higher_classification_overrides_lower"
    audit_trail: true

  # 合规映射
  compliance_mapping:
    gdpr:
      personal_data: "confidential"
      sensitive_personal_data: "restricted"

    hipaa:
      protected_health_info: "restricted"

    pci_dss:
      cardholder_data: "restricted"