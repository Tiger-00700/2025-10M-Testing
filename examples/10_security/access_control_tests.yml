# 权限控制测试配置
# 锚点056 对应配置

access_control_tests:
  - category: 最小权限 (Least Privilege)
    key_test_points:
      - 角色权限验证
      - 用户权限检查
      - 作业权限确认
    validation_methods:
      - 访问矩阵构建
      - 权限分配审核
      - 越权访问测试
    expected_results:
      - 无横向越权
      - 无纵向越权
      - 权限按需分配

  - category: 权限继承 (Permission Inheritance)
    key_test_points:
      - 父子角色传递
      - 继承关系验证
      - 撤销机制测试
    validation_methods:
      - 角色层级检查
      - 权限传递验证
      - 继承链路测试
    expected_results:
      - 权限正确传递
      - 撤销立即生效
      - 继承关系清晰

  - category: 动态权限 (Dynamic Permissions)
    key_test_points:
      - 临时访问限时
      - 限时回收验证
      - 过期自动失效
    validation_methods:
      - 时间窗口测试
      - 回收机制验证
      - 过期处理检查
    expected_results:
      - 限时访问生效
      - 过期自动回收
      - 无遗留权限

  - category: 细粒度控制 (Fine-grained Control)
    key_test_points:
      - 库级权限控制
      - 表级权限控制
      - 字段级权限控制
      - 行级权限控制
    validation_methods:
      - 多级权限测试
      - 控制精度验证
      - 策略应用检查
    expected_results:
      - 精确控制生效
      - 权限隔离完整
      - 访问控制准确

  - category: 多租户隔离 (Multi-tenant Isolation)
    key_test_points:
      - 跨租户访问拒绝
      - 数据隔离验证
      - 租户边界检查
    validation_methods:
      - 隔离测试执行
      - 边界渗透测试
      - 访问控制验证
    expected_results:
      - 数据隔离无泄露
      - 租户边界清晰
      - 跨租户访问拒绝

  - category: 审计留痕 (Audit Trail)
    key_test_points:
      - 权限变更记录
      - 操作日志完整
      - 变更可追溯
    validation_methods:
      - 日志完整性检查
      - 变更记录验证
      - 追溯链路测试
    expected_results:
      - 变更可追溯
      - 日志完整可靠
      - 审计链路闭环