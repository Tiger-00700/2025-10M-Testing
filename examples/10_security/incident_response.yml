# examples/10_security/incident_response.yml
# 数据安全事件应急响应配置

incident_response:
  # 事件分类
  incident_categories:
    data_breach:
      severity: "critical"
      response_time: "1_hour"
      notification_channels: ["security_team", "legal", "executives"]
      escalation_required: true

    unauthorized_access:
      severity: "high"
      response_time: "4_hours"
      notification_channels: ["security_team", "data_owners"]
      escalation_required: true

    data_corruption:
      severity: "high"
      response_time: "2_hours"
      notification_channels: ["data_team", "operations"]
      escalation_required: false

    compliance_violation:
      severity: "medium"
      response_time: "24_hours"
      notification_channels: ["compliance_team", "legal"]
      escalation_required: true

    policy_violation:
      severity: "low"
      response_time: "48_hours"
      notification_channels: ["policy_team"]
      escalation_required: false

  # 响应流程
  response_process:
    phase_1_identification:
      name: "事件识别与确认"
      duration: "30_minutes"
      actions:
        - "验证事件真实性"
        - "评估事件影响范围"
        - "确定事件分类和严重程度"
        - "激活响应团队"

    phase_2_containment:
      name: "事件遏制"
      duration: "2_hours"
      actions:
        - "隔离受影响系统"
        - "停止数据泄露途径"
        - "实施临时安全措施"
        - "通知相关利益方"

    phase_3_investigation:
      name: "事件调查"
      duration: "24_hours"
      actions:
        - "收集事件证据"
        - "分析攻击向量"
        - "确定根本原因"
        - "评估数据暴露程度"

    phase_4_recovery:
      name: "恢复与修复"
      duration: "48_hours"
      actions:
        - "清理受影响系统"
        - "恢复数据和系统"
        - "验证系统完整性"
        - "实施永久修复措施"

    phase_5_lessons_learned:
      name: "经验总结"
      duration: "1_week"
      actions:
        - "编写事件报告"
        - "识别改进措施"
        - "更新安全策略"
        - "开展培训和演练"

  # 响应团队
  response_team:
    incident_response_team:
      leader: "安全事件响应协调员"
      members:
        - "首席信息安全官 (CISO)"
        - "安全运营中心 (SOC) 分析师"
        - "IT 安全工程师"
        - "法律顾问"
        - "公关代表"
        - "业务连续性经理"

      responsibilities:
        - "协调响应活动"
        - "决策关键行动"
        - "与外部机构沟通"
        - "管理事件生命周期"

    technical_team:
      leader: "技术响应负责人"
      members:
        - "系统管理员"
        - "网络工程师"
        - "数据库管理员"
        - "应用程序开发人员"

      responsibilities:
        - "执行技术修复"
        - "分析技术细节"
        - "实施安全补丁"
        - "恢复系统服务"

    communication_team:
      leader: "沟通协调员"
      members:
        - "企业沟通经理"
        - "法律顾问"
        - "客户服务代表"

      responsibilities:
        - "起草沟通材料"
        - "管理媒体关系"
        - "通知受影响方"
        - "维护声誉"

  # 沟通策略
  communication_strategy:
    internal_communication:
      immediate_notification:
        recipients: ["response_team", "executives", "affected_departments"]
        method: "secure_messaging_system"
        content: "事件基本信息、影响评估、响应措施"

      regular_updates:
        frequency: "every_4_hours"
        recipients: ["all_employees", "stakeholders"]
        method: ["email", "internal_portal"]
        content: "事件进展、恢复时间表、安全建议"

    external_communication:
      regulatory_reporting:
        timeframe: "within_72_hours"
        authorities: ["data_protection_authority", "law_enforcement"]
        content: "事件详情、影响评估、采取措施"

      customer_notification:
        condition: "personal_data_affected"
        timeframe: "within_72_hours"
        method: ["email", "website_posting"]
        content: "事件说明、影响范围、保护措施、联系方式"

      media_response:
        prepared_statements: true
        spokesperson: "designated_communications_lead"
        channels: ["press_release", "social_media", "news_interviews"]

  # 工具和资源
  tools_resources:
    incident_management_platform:
      tool: "ServiceNow Security Operations"
      capabilities:
        - "事件记录和跟踪"
        - "自动化工作流"
        - "报告生成"

    forensic_tools:
      - "EnCase"
      - "FTK (Forensic Toolkit)"
      - "Wireshark"
      - "Log analysis tools"

    communication_tools:
      - "Microsoft Teams (安全频道)"
      - "Slack (紧急响应频道)"
      - "加密邮件系统"

    documentation_templates:
      - "事件响应计划"
      - "事件报告模板"
      - "沟通材料模板"
      - "经验总结模板"

  # 演练和培训
  training_drills:
    table_top_exercises:
      frequency: "quarterly"
      duration: "2_hours"
      participants: "response_team"
      scenarios: ["data_breach", "ransomware", "insider_threat"]

    full_scale_drills:
      frequency: "biannually"
      duration: "4_hours"
      participants: "all_teams"
      objectives:
        - "测试响应流程"
        - "验证沟通渠道"
        - "评估团队准备度"

    training_programs:
      security_awareness:
        frequency: "annual"
        audience: "all_employees"
        content: "事件识别、报告程序、安全最佳实践"

      specialized_training:
        frequency: "as_needed"
        audience: "response_team"
        content: "高级取证、危机沟通、法规遵从"

  # 绩效指标
  metrics_kpis:
    response_effectiveness:
      - "平均响应时间"
      - "事件解决时间"
      - "系统恢复时间"

    process_efficiency:
      - "流程遵从率"
      - "自动化程度"
      - "资源利用率"

    continuous_improvement:
      - "演练参与率"
      - "培训完成率"
      - "改进措施实施率"

  # 持续改进
  continuous_improvement:
    after_action_reviews:
      timing: "within_1_week_of_incident_resolution"
      participants: "response_team_and_stakeholders"
      focus_areas:
        - "流程有效性"
        - "团队协调"
        - "工具和资源"
        - "沟通效果"

    lessons_learned_repository:
      location: "secure_knowledge_base"
      access: "response_team_only"
      content_types:
        - "事件分析报告"
        - "改进建议"
        - "最佳实践"
        - "预防措施"

    process_updates:
      review_cycle: "quarterly"
      approval_process: "change_management_board"
      implementation_priority: "based_on_risk_assessment"