# examples/12_env/env_isolation.yml
# 多环境数据隔离配置示例

environment_isolation:
  # 环境类型定义
  environments:
    development:
      isolation_level: "logical"
      data_sharing: "allowed_within_team"
      backup_frequency: "daily"
      
    staging:
      isolation_level: "physical"
      data_sharing: "restricted"
      backup_frequency: "daily"
      
    production:
      isolation_level: "strict_physical"
      data_sharing: "none"
      backup_frequency: "hourly"

  # 多租户隔离策略
  multi_tenant_config:
    tenant_separation:
      database_level: true
      schema_level: true
      table_level: false
      
    resource_quotas:
      max_storage_gb: 100
      max_connections: 50
      max_query_timeout_seconds: 300
      
    access_patterns:
      cross_tenant_queries: "forbidden"
      shared_resources: "metered"
      audit_trail: "mandatory"

  # 数据隔离机制
  data_isolation:
    logical_separation:
      - schema_prefix: "tenant_{tenant_id}_"
      - table_prefix: "env_{env_name}_"
      - view_restrictions: "tenant_scoped"
      
    physical_separation:
      - separate_databases: true
      - separate_clusters: false
      - network_segmentation: true
      
    encryption:
      data_at_rest: true
      data_in_transit: true
      key_rotation_days: 90

  # 环境间数据流控制
  data_flow_control:
    promotion_rules:
      dev_to_staging: "automated"
      staging_to_prod: "manual_approval"
      prod_to_any: "forbidden"
      
    data_masking:
      enabled: true
      masking_rules: "environment_specific"
      validation_required: true

  # 监控与告警
  monitoring:
    isolation_breaches:
      alert_enabled: true
      alert_channels: ["email", "slack"]
      
    resource_usage:
      track_by_tenant: true
      quota_alerts: true