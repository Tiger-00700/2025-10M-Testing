# 环境隔离与配额策略配置
# 定义资源配额、隔离策略和动态调整机制

# 配额分配策略
quota_allocation:
  dimensions:
    - name: "资源配额分配"
      measure: "CPU/内存/存储按环境权重分配"
      implementation: "静态配额 + 动态调整"
      monitoring: "资源利用率 > 80%"
      adjustment: "自动扩容/告警"

    - name: "动态调整"
      measure: "高峰期弹性扩容，低峰期回收"
      implementation: "HPA + 定时任务"
      monitoring: "请求QPS、响应时间"
      adjustment: "基于业务指标"

    - name: "优先级保障"
      measure: "生产 > 预发 > 测试 > 开发"
      implementation: "QoS分类 + 抢占式调度"
      monitoring: "关键服务SLO达成率"
      adjustment: "优先级队列调度"

    - name: "成本控制"
      measure: "按使用量计费，设置预算上限"
      implementation: "多租户计费 + 预算告警"
      monitoring: "月度成本增长率"
      adjustment: "自动停机/降配"

    - name: "隔离级别"
      measure: "网络/存储/计算资源隔离"
      implementation: "Namespace/VPC/资源池"
      monitoring: "串扰事件发生率"
      adjustment: "隔离策略强化"

# 环境配额配置示例
quotas:
  dev:
    cpu: "2"
    memory: "4Gi"
    storage: "50Gi"
    priority: "low"
    scaling: "manual"
    budget_limit: "1000"

  test:
    cpu: "4"
    memory: "8Gi"
    storage: "100Gi"
    priority: "medium"
    scaling: "auto"
    budget_limit: "2000"

  staging:
    cpu: "8"
    memory: "16Gi"
    storage: "200Gi"
    priority: "high"
    scaling: "auto"
    budget_limit: "5000"

  prod:
    cpu: "16"
    memory: "32Gi"
    storage: "500Gi"
    priority: "critical"
    scaling: "auto"
    budget_limit: "10000"

# 隔离策略配置
isolation_strategies:
  physical:
    level: "最高安全"
    cost: "最高"
    suitable: "生产/预发环境"
    implementation: "独立服务器/网络"

  logical:
    level: "平衡安全与成本"
    cost: "中等"
    suitable: "测试/开发环境"
    implementation: "Namespace/VPC/容器隔离"

  hybrid:
    level: "按敏感度分级"
    cost: "灵活"
    suitable: "混合场景"
    implementation: "组合使用物理+逻辑隔离"

# 监控配置
monitoring_config:
  metrics:
    - name: "resource_utilization"
      threshold: "80%"
      action: "scale_up"
      severity: "warning"

    - name: "error_rate"
      threshold: "1%"
      action: "alert"
      severity: "critical"

    - name: "response_time"
      threshold: "200ms"
      action: "alert"
      severity: "warning"

    - name: "cost_growth"
      threshold: "20%"
      action: "budget_alert"
      severity: "info"

  alerts:
    - condition: "cpu_usage > 90%"
      severity: "critical"
      channels: ["email", "slack", "pager"]
      escalation: "30m"

    - condition: "memory_usage > 85%"
      severity: "warning"
      channels: ["slack"]
      escalation: "1h"

    - condition: "budget_usage > 80%"
      severity: "info"
      channels: ["email"]
      escalation: "24h"

# 动态调整配置
scaling_policies:
  hpa_config:
    min_replicas: 1
    max_replicas: 10
    target_cpu_utilization: 70
    target_memory_utilization: 80

  scheduled_scaling:
    - name: "business_hours"
      replicas: 5
      schedule: "0 9 * * 1-5"  # 周一到周五早上9点

    - name: "off_hours"
      replicas: 2
      schedule: "0 18 * * 1-5"  # 周一到周五晚上6点

  cost_optimization:
    idle_timeout: "30m"
    scale_down_threshold: "20%"
    budget_alert_threshold: "80%"