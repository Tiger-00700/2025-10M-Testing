# 多集群环境管理架构配置
# 定义多集群/多地域部署的架构和配置

clusters:
  - name: cluster-beijing
    region: cn-north
    environment: prod
    sync:
      enabled: true
      mode: async
      latency_threshold: 100ms
    monitoring:
      enabled: true
      central_reporting: true
    isolation:
      network: vpc
      data: encrypted
    compliance:
      data_residency: true
      audit_logging: true

  - name: cluster-shanghai
    region: cn-east
    environment: staging
    sync:
      enabled: true
      mode: sync
      latency_threshold: 50ms
    monitoring:
      enabled: true
      central_reporting: true
    isolation:
      network: vpc
      data: encrypted
    compliance:
      data_residency: true
      audit_logging: true

  - name: cluster-shenzhen
    region: cn-south
    environment: disaster-recovery
    sync:
      enabled: true
      mode: async
      latency_threshold: 200ms
    monitoring:
      enabled: true
      central_reporting: true
    isolation:
      network: vpc
      data: encrypted
    compliance:
      data_residency: true
      audit_logging: true

# 统一控制面配置
central_control_plane:
  name: "统一控制面 (Central Control Plane)"
  components:
    - environment_mgmt_platform:
        name: "环境管理平台 (Environment Mgmt Platform)"
        features:
          - cluster_registration: "集群注册与配置管理"
          - policy_sync: "跨集群策略同步"
          - unified_monitoring: "统一监控与告警"
    - data_sync:
        name: "数据同步模块"
        features:
          - cross_cluster_sync: "跨集群/地域数据复制"
          - consistency_guarantee: "一致性保证"
    - config_mgmt:
        name: "配置管理"
        features:
          - iac_driven: "IaC驱动的环境配置"
          - change_mgmt: "变更管理"
    - monitoring_agents:
        name: "监控代理"
        features:
          - local_monitoring: "各集群本地监控"
          - central_reporting: "数据上报到统一监控中心"

# 统一监控中心
central_monitor:
  name: "统一监控中心 (Central Monitor)"
  features:
    - metrics_aggregation: "指标聚合"
    - unified_alerting: "告警统一"
    - performance_analysis: "性能分析"

# 网络拓扑
network_topology:
  sync_connections:
    - from: cluster-beijing
      to: cluster-shanghai
      type: bidirectional
    - from: cluster-beijing
      to: cluster-shenzhen
      type: bidirectional
    - from: cluster-shanghai
      to: cluster-shenzhen
      type: bidirectional

  monitoring_connections:
    - from: all_clusters
      to: central_monitor
      type: unidirectional